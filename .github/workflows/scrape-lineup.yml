name: Scrape Takara Tomy Lineup

on:
  schedule:
    # Every day at 09:00 UTC (17:00 JST / Taiwan time)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scraper
        run: node scripts/scrape-lineup.js

      - name: Check for new products
        id: check
        run: |
          if git diff --name-only | grep -q 'lineup-scraped.json\|products/'; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            # Extract new product count from JSON
            NEW_COUNT=$(node -e "const d=require('./data/lineup-scraped.json'); console.log(d.newCount)")
            echo "new_count=$NEW_COUNT" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lineup-scraped.json products/
          git diff --cached --quiet || git commit -m "Auto-scrape: update lineup data"
          git push

      - name: Create issue for new bey products
        if: steps.check.outputs.has_changes == 'true'
        run: |
          # Generate new bey product list
          NEW_BEYS=$(node -e "
            const d = require('./data/lineup-scraped.json');
            const beys = d.products.filter(p => p.isNew && ['starter','booster','random_booster','set'].includes(p.type));
            if (!beys.length) { console.log(''); process.exit(); }
            beys.forEach(p => console.log('- **' + p.code + '** ' + (p.nameJp||'?') + ' (' + (p.category||p.type) + ', ' + (p.release||'?') + ')'));
          ")
          if [ -n "$NEW_BEYS" ]; then
            gh issue create \
              --title "New products detected ($(date +%Y-%m-%d))" \
              --body "$(cat <<EOF
          The scraper found new beyblade products on Takara Tomy's lineup page:

          $NEW_BEYS

          These need to be manually added to \`data/prod-beys.json\` with proper bey codes.
          Remember: always add new entries at the **END** of the array.
          EOF
          )"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
