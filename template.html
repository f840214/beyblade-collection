<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>Beyblade X 收藏管理</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BeyX 收藏">
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel2: #1f232c;
    --border: #2a2f3a;
    --text: #e6e9ef;
    --muted: #8a93a3;
    --accent: #4ea1ff;
    --accent2: #7cf;
    --owned: #2ecc71;
    --missing: #ff6b6b;
    --warn: #f5a623;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg); color: var(--text);
    font-size: 14px; line-height: 1.45;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--panel);
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header .stats { color: var(--muted); font-size: 12px; }
  header .stats b { color: var(--text); font-weight: 600; }
  header .actions { margin-left: auto; display: flex; gap: 6px; }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  /* 防止 iOS Safari 在點擊 input 時自動放大畫面 */
  input, textarea, select { font-size: 16px; }
  button:hover { background: #2a3040; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #001833; }
  button.primary:hover { background: #6cb3ff; }
  button.danger { color: var(--missing); }

  .layout { display: grid; grid-template-columns: 380px 1fr; height: calc(100vh - 49px); }
  .sidebar { border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--panel); }
  .main { overflow: auto; padding: 16px 20px; }

  .tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tab {
    flex: 1; padding: 10px; text-align: center; cursor: pointer;
    color: var(--muted); border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }

  .toolbar { padding: 10px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--border); }
  .toolbar input[type="search"] {
    width: 100%; padding: 7px 10px; background: var(--bg);
    border: 1px solid var(--border); color: var(--text); border-radius: 6px;
  }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .filters label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .filters input { margin: 0; }

  .list { flex: 1; overflow: auto; padding: 4px 0; }
  .group {
    border-top: 1px solid var(--border);
  }
  .group:first-child { border-top: none; }
  .group-head {
    padding: 8px 12px; font-size: 12px; font-weight: 600;
    background: var(--panel2); color: var(--accent2);
    position: sticky; top: 0; z-index: 1;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer;
  }
  .group-head .count { color: var(--muted); font-weight: normal; font-size: 11px; }
  .group-body { display: block; }
  .group.collapsed .group-body { display: none; }
  .item {
    padding: 6px 12px 6px 24px; cursor: pointer;
    display: flex; align-items: center; gap: 8px; font-size: 13px;
    border-left: 3px solid transparent;
  }
  .item:hover { background: rgba(255,255,255,0.03); }
  .item.selected { background: rgba(78,161,255,0.12); border-left-color: var(--accent); }
  .item.owned { color: var(--text); }
  .item.owned .name { color: var(--owned); }
  .item .qty {
    margin-left: auto; font-size: 11px; color: var(--muted);
    background: var(--panel2); padding: 1px 6px; border-radius: 10px;
  }
  .item.owned .qty { background: rgba(46,204,113,0.15); color: var(--owned); }
  .item .check { font-family: monospace; color: var(--muted); padding: 0 4px; border-radius: 50%; }
  .item.owned .check { color: var(--owned); }
  .item .check.toggleable { cursor: pointer; }
  .item .check.toggleable:hover { background: rgba(78,161,255,0.2); color: var(--accent); }
  .item.owned .check.toggleable:hover { background: rgba(46,204,113,0.25); }

  .detail h2 { margin: 0 0 4px; font-size: 18px; }
  .detail .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px; margin-bottom: 12px;
  }
  .card h3 { margin: 0 0 8px; font-size: 14px; color: var(--accent2); font-weight: 600; }
  .card .row { display: flex; gap: 10px; align-items: baseline; padding: 3px 0; }
  .card .row .k { color: var(--muted); width: 80px; flex-shrink: 0; font-size: 12px; }
  .card .row .v { color: var(--text); }
  .desc { color: var(--muted); font-size: 12px; margin-top: 4px; line-height: 1.5; }

  .bit-img-wrap {
    background: #000; border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 12px; padding: 8px; display: flex; justify-content: center;
  }
  .bit-img { max-height: 220px; width: auto; object-fit: contain; }

  .variants {
    display: grid; gap: 6px;
  }
  .variant {
    border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px;
    display: grid; grid-template-columns: auto 1fr auto auto auto; gap: 10px; align-items: center;
  }
  .variant.owned { border-color: var(--owned); background: rgba(46,204,113,0.05); }
  .variant .vbey { font-weight: 600; }
  .variant .vparts { color: var(--muted); font-size: 12px; }
  .variant .vqty { width: 50px; text-align: center;
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text); padding: 4px; border-radius: 4px;
  }
  .variant .badge {
    background: var(--panel2); color: var(--muted); padding: 2px 6px; border-radius: 4px;
    font-size: 11px;
  }
  .variant.owned .badge { background: var(--owned); color: #002b14; }

  .pill {
    display: inline-block; padding: 1px 7px; margin-right: 4px;
    border-radius: 10px; font-size: 11px;
    background: var(--panel2); color: var(--muted);
  }
  .pill.att { background: #6b1f2a; color: #ffb8c1; }
  .pill.def { background: #1c4564; color: #b8d8ff; }
  .pill.sta { background: #1a4f30; color: #b8ffd1; }
  .pill.bal { background: #5a4711; color: #ffe5a1; }
  .pill.owned { background: var(--owned); color: #002b14; }
  .pill.missing { background: var(--missing); color: #1a0000; }

  .empty { color: var(--muted); padding: 30px; text-align: center; }

  .tier-row {
    display: grid; grid-template-columns: 60px 1fr; gap: 12px;
    align-items: start; padding: 8px 0;
    border-top: 1px solid var(--border);
  }
  .tier-row:first-of-type { border-top: none; }
  .tier-label {
    font-weight: 700; font-size: 13px; padding: 4px 8px;
    border-radius: 4px; background: var(--panel2); color: var(--muted);
    text-align: center; min-width: 44px;
  }
  .tier-T0    { background: #6b1f2a; color: #ffd0d8; }
  .tier-T0-5  { background: #5a2a44; color: #ffceec; }
  .tier-T1    { background: #5a4711; color: #ffe5a1; }
  .tier-T1-5  { background: #424a14; color: #e9f0a8; }
  .tier-T2    { background: #1a4f30; color: #b8ffd1; }
  .tier-T3    { background: #1c4564; color: #b8d8ff; }
  .tier-T4    { background: #34324a; color: #c2c0e0; }
  .tier-T5    { background: #2a2f3a; color: #8a93a3; }
  .tier-pills { display: flex; flex-wrap: wrap; gap: 4px; }
  .tier-pill {
    padding: 3px 8px; border-radius: 12px; font-size: 12px;
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border);
    cursor: default;
  }
  .tier-pill.owned { background: rgba(46,204,113,0.15); color: var(--owned); border-color: var(--owned); }
  .tier-pill.missing { opacity: 0.4; }
  .tier-pill[onclick] { cursor: pointer; }
  .tier-pill[onclick]:hover { background: #2a3040; }

  .source-list { display: flex; flex-wrap: wrap; gap: 4px; }
  .source-list .src {
    padding: 2px 8px; border-radius: 4px; background: var(--panel2);
    font-size: 11px; cursor: pointer; border: 1px solid var(--border);
  }
  .source-list .src.owned { background: rgba(46,204,113,0.18); border-color: var(--owned); color: var(--owned); }
  .source-list .src:hover { background: #2a3040; }

  .progress {
    height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden;
    margin-top: 4px;
  }
  .progress > div { height: 100%; background: var(--accent); }

  textarea.io {
    width: 100%; min-height: 240px; background: var(--bg);
    color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px; font-family: ui-monospace, monospace;
  }
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; width: 600px; max-width: 92vw; max-height: 85vh;
    display: flex; flex-direction: column;
  }
  .modal h2 { margin: 0 0 8px; font-size: 16px; }
  .modal .actions { margin-top: 10px; display: flex; gap: 6px; justify-content: flex-end; }

  .mobile-back-bar { display: none; }

  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { border-right: none; }
    .main {
      display: none;
      position: fixed; inset: 0;
      background: var(--bg); z-index: 50;
      padding-top: 0;
    }
    body.show-detail .sidebar { display: none; }
    body.show-detail .main { display: block; }
    .mobile-back-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; border-bottom: 1px solid var(--border);
      background: var(--panel);
      position: sticky; top: 0; z-index: 10;
      margin: -16px -20px 24px -20px;
    }
  }
</style>
</head>
<body>
<header>
  <h1>Beyblade X 收藏管理 <span style="color:var(--muted); font-size:11px; font-weight:normal; margin-left:4px;" title="建置日期 __BUILD_DATE__">__VERSION__</span></h1>
  <div class="stats" id="stats">載入中…</div>
  <div class="actions">
    <button onclick="openImport()">📥 匯入</button>
    <button onclick="openExport()">📤 匯出</button>
    <button onclick="openShare()">🖼 分享</button>
    <button class="danger" onclick="clearAll()">清空</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="tabs">
      <div class="tab active" data-tab="products" onclick="switchTab('products')">商品</div>
      <div class="tab" data-tab="parts" onclick="switchTab('parts')">零件</div>
      <div class="tab" data-tab="mine" onclick="switchTab('mine')">收藏</div>
      <div class="tab" data-tab="builds" onclick="switchTab('builds')">配置</div>
      <div class="tab" data-tab="tier" onclick="switchTab('tier')">排行榜</div>
    </div>
    <div class="toolbar">
      <input type="search" id="search" placeholder="搜尋商品代號 / 陀螺 / 零件 / 中文名…" oninput="render()">
      <div class="filters" id="filters"></div>
    </div>
    <div class="list" id="list"></div>
  </aside>

  <main class="main">
    <div id="detail" class="detail"><div class="empty">← 從左側清單選一個項目開始</div></div>
  </main>
</div>

<div class="modal-bg" id="modal-bg" onclick="if(event.target.id==='modal-bg')closeModal()">
  <div class="modal">
    <h2 id="modal-title">標題</h2>
    <div id="modal-body" style="flex:1; overflow:auto;"></div>
    <div class="actions" id="modal-actions"></div>
  </div>
</div>

<script>
/*__DATA__*/

// ============================================================
// 資料整理
// ============================================================
const STORAGE_KEY = "beyx_collection_v1";

// 把 prod-beys 整理成更易用的結構
// 每筆變體有唯一 id: "<productId>#<index>"
const VARIANTS = [];
const PRODUCTS = {}; // productId -> { id, type, variants: [variant], hasCoat }

DB.beys.forEach((row, idx) => {
  // row: [productId, type, "blade ratchet bit", youtube?, options?]
  const [productId, type, parts, ...rest] = row;
  let youtube = null, opts = {};
  rest.forEach(r => {
    if (typeof r === "string") youtube = r;
    else if (r && typeof r === "object") opts = r;
  });
  const tokens = parts.split(/\s+/);
  let blade, ratchet, bit;
  if (tokens.length === 3) {
    [blade, ratchet, bit] = tokens;
  } else {
    // CX format eg "Bh.Bl.B.K 1-50 I" or 3 tokens always — but "Dr.Ar.S 2-70 K" splits into 3
    blade = tokens.slice(0, tokens.length - 2).join(" ");
    ratchet = tokens[tokens.length - 2];
    bit = tokens[tokens.length - 1];
  }
  const v = {
    id: productId + "#" + idx,
    productId, type, blade, ratchet, bit,
    youtube, opts, raw: parts,
  };
  VARIANTS.push(v);
  if (!PRODUCTS[productId]) PRODUCTS[productId] = { id: productId, type, variants: [] };
  PRODUCTS[productId].variants.push(v);
});

const PRODUCT_LIST = Object.values(PRODUCTS).sort((a, b) => productSort(a.id).localeCompare(productSort(b.id)));

function productSort(id) {
  // BX-35 -> "BX-035", BXG-21 -> "BXG-021", CX-7 -> "CX-007"
  return id.replace(/(\d+)/g, n => n.padStart(4, "0"));
}

function productSeries(id) {
  const m = id.match(/^([A-Z]+)/);
  return m ? m[1] : "其他";
}

// 零件查找
// CX 戰刃片段在 chip / main / over / metal / assist / hasbro 等分類下查詢
// 位置 → 分類偏好 (4-part: chip.metal-or-main.over.assist; 3-part: chip.main.assist)
const CX_POSITIONS = {
  3: ["chip", "main", "assist"],
  4: ["chip", ["metal", "main"], "over", "assist"],
};
function findCxSegmentAt(seg, pos, total) {
  if (!seg || seg === "/") return null;
  const cx = (DB.bladeDivided && DB.bladeDivided.CX) || {};
  const positional = CX_POSITIONS[total];
  const fallback = ["chip", "metal", "main", "over", "assist", "hasbro"];
  const cats = positional && positional[pos]
    ? (Array.isArray(positional[pos]) ? positional[pos] : [positional[pos]])
    : fallback;
  for (const cat of cats) {
    if (cx[cat] && cx[cat][seg]) return { ...cx[cat][seg], _category: cat, _code: seg };
  }
  return null;
}
// 組合中文: 把有翻譯的段直接接起來 (e.g. Bh.Bl.B.K → 龍王閃擊)
// 沒有任何段有中文就回退到原始代號
function cxComposeChi(code) {
  const segs = code.split(".").map(s => s.trim());
  const named = segs.map((s, i) => {
    if (!s || s === "/") return null;
    const f = findCxSegmentAt(s, i, segs.length);
    if (!f) return null;
    return preferredChi(f.names && f.names.chi) || null;
  }).filter(Boolean);
  return named.length ? named.join("") : code;
}
function bladeInfo(code) {
  if (code.includes(".") || code.includes("/")) {
    const chi = cxComposeChi(code);
    return { code, names: { chi: chi }, desc: "(CX 組合刃)", isCx: true };
  }
  return DB.blade[code] || (DB.bladeCollab && DB.bladeCollab[code]) || { code, names: { chi: "(未知)" } };
}
function ratchetInfo(code) { return DB.ratchet[code] || { desc: "(未知)" }; }
function bitInfo(code) { return DB.bit[code] || { names: { chi: "(未知)" } }; }

// 軸圖檔名對照: 部分檔名與資料代號不一致 (全形/大小寫/全名)
const BIT_IMG_FILENAME = { N: "Ｎ", Op: "OP", Tr: "Turbo" };
function bitImageSrc(code) {
  return `bits/${encodeURIComponent(BIT_IMG_FILENAME[code] || code)}.png`;
}

// 來源資料用 "/" 表示「該位置沒有零件」(例如單售零件包)
// CX 還會用 "/./.X" 形式; 固鎖也用 "=" 表示「沒有固鎖」(例如 "Em.Mg.H = Op")
// 拆掉這些占位符後沒剩任何字元就是空
function isEmptyPart(code) {
  return !code || !code.replace(/[\/\.=]/g, "").length;
}

// 商品種類代號 → 中文。第二段 H 表示異色版／再推出。
const PRODUCT_TYPE_NAMES = {
  "S":  "起始包",
  "B":  "補充包",
  "St": "套組",
  "SS": "對戰盤套組",
  "RB": "隨機補充包",
  "Lm": "限定",
};
function productTypeName(code) {
  if (!code) return "";
  const parts = code.split(/\s+/);
  const main = PRODUCT_TYPE_NAMES[parts[0]] || parts[0];
  const isHasbro = parts.includes("H");
  return isHasbro ? main + "・異色版" : main;
}

// chi 欄位格式為「港譯 台譯」(以空白分隔)，取最後一段=台譯
// 名字內的 "\" 是 chip\main 結構分隔符，顯示時拿掉 (e.g. "空力\天馬" → "空力天馬")
function preferredChi(c) {
  if (!c) return "";
  const tokens = c.split(/\s+/).filter(Boolean);
  return (tokens[tokens.length - 1] || "").replace(/\\/g, "");
}
function bladeName(code) {
  const b = bladeInfo(code);
  if (b.isCx) return (b.names && b.names.chi) || code;
  return preferredChi(b.names && b.names.chi) || code;
}
function bitName(code) {
  const b = bitInfo(code);
  return preferredChi(b.names && b.names.chi) || code;
}

// 由所有資料統計可獲得的零件 (排除 "/" 等占位符)
const ALL_BLADES = new Set();
const ALL_RATCHETS = new Set();
const ALL_BITS = new Set();
VARIANTS.forEach(v => {
  if (!isEmptyPart(v.blade))   ALL_BLADES.add(v.blade);
  if (!isEmptyPart(v.ratchet)) ALL_RATCHETS.add(v.ratchet);
  if (!isEmptyPart(v.bit))     ALL_BITS.add(v.bit);
});

// 從零件 → 變體列表
const PART_SOURCES = { blade: {}, ratchet: {}, bit: {} };
VARIANTS.forEach(v => {
  if (!isEmptyPart(v.blade))   (PART_SOURCES.blade[v.blade]     = PART_SOURCES.blade[v.blade]     || []).push(v);
  if (!isEmptyPart(v.ratchet)) (PART_SOURCES.ratchet[v.ratchet] = PART_SOURCES.ratchet[v.ratchet] || []).push(v);
  if (!isEmptyPart(v.bit))     (PART_SOURCES.bit[v.bit]         = PART_SOURCES.bit[v.bit]         || []).push(v);
});

// ============================================================
// 收藏狀態
// ============================================================
let state = loadState();

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if (s && s.owned) {
      if (!Array.isArray(s.builds)) s.builds = [];
      return s;
    }
  } catch (e) {}
  return { owned: {}, builds: [] };  // owned[variantId] = qty; builds[]={id,name,blade,ratchet,bit,note}
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function setOwned(vid, qty) {
  qty = Math.max(0, parseInt(qty) || 0);
  if (qty <= 0) delete state.owned[vid];
  else state.owned[vid] = qty;
  saveState();
  render();
}
function isOwned(vid) { return (state.owned[vid] || 0) > 0; }
function ownedQty(vid) { return state.owned[vid] || 0; }

// 配置 (builds) 操作
function newBuildId() { return "b" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function getBuild(id) { return state.builds.find(b => b.id === id); }
function newBuild() {
  const b = { id: newBuildId(), name: "新配置 " + (state.builds.length + 1), blade: "", ratchet: "", bit: "", note: "" };
  state.builds.push(b);
  saveState();
  selected = { type: "build", id: b.id };
  render();
}
function updateBuildField(id, field, value) {
  const b = getBuild(id);
  if (!b) return;
  b[field] = value;
  saveState();
  renderList(); renderStats();  // 刷側欄與頂統計，但不刷 detail (避免輸入失焦)
}
function deleteBuild(id) {
  if (!confirm("刪除這個配置？")) return;
  state.builds = state.builds.filter(b => b.id !== id);
  saveState(); selected = null; render();
}
function duplicateBuild(id) {
  const orig = getBuild(id); if (!orig) return;
  const copy = { ...orig, id: newBuildId(), name: orig.name + " 複本" };
  state.builds.push(copy); saveState();
  selected = { type: "build", id: copy.id }; render();
}
// 把變體顯示成「中文戰刃 固鎖 中文軸」(用於來源 pill 顯示)
function variantDisplayChi(v) {
  const b = isEmptyPart(v.blade) ? "—" : (bladeName(v.blade) || v.blade);
  const r = isEmptyPart(v.ratchet) ? "—" : v.ratchet;
  const i = isEmptyPart(v.bit) ? "—" : (bitName(v.bit) || v.bit);
  return `${b} ${r} ${i}`;
}

function buildStatus(b) {
  const op = ownedParts();
  const need = [b.blade, b.ratchet, b.bit].filter(Boolean).length;
  const have = (b.blade && op.blades.has(b.blade) ? 1 : 0) +
               (b.ratchet && op.ratchets.has(b.ratchet) ? 1 : 0) +
               (b.bit && op.bits.has(b.bit) ? 1 : 0);
  return { need, have, complete: need === 3 && have === 3, missing: need - have };
}

function ownedParts() {
  const blades = new Set(), ratchets = new Set(), bits = new Set();
  Object.keys(state.owned).forEach(vid => {
    const v = VARIANTS.find(x => x.id === vid);
    if (!v) return;
    if (!isEmptyPart(v.blade))   blades.add(v.blade);
    if (!isEmptyPart(v.ratchet)) ratchets.add(v.ratchet);
    if (!isEmptyPart(v.bit))     bits.add(v.bit);
  });
  return { blades, ratchets, bits };
}

let activeTab = "products";
let selected = null; // { type: "product"|"blade"|"ratchet"|"bit", id }
let filterOpts = {
  ownedOnly: false,
  missingOnly: false,
  series: {},
};
const collapsedGroups = new Set(); // 記住哪些群組是摺疊的，避免 render 時被重置
let mineView = "detail"; // detail | table

function toggleGroup(key) {
  if (collapsedGroups.has(key)) collapsedGroups.delete(key);
  else collapsedGroups.add(key);
  render();
}

function setMineView(v) { mineView = v; render(); }

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll(".tab").forEach(el => el.classList.toggle("active", el.dataset.tab === tab));
  selected = null;
  const searchEl = document.getElementById("search");
  if (searchEl) searchEl.value = "";
  render();
}

  const wrap = document.getElementById("filters");
  const searchEl = document.getElementById("search");
  if (activeTab === "mine") {
    wrap.innerHTML = `<span style="color: var(--muted); font-size: 12px;">點左側類別跳到對應段落</span>`;
    searchEl.placeholder = "在收藏中搜尋…";
    return;
  }
  if (activeTab === "tier") {
    wrap.innerHTML = `<span style="color: var(--muted); font-size: 12px;">點左側類別跳到對應段落</span>`;
    searchEl.placeholder = "在排行榜中搜尋…";
    return;
  }
  if (activeTab === "builds") {
    wrap.innerHTML = `<span style="color: var(--muted); font-size: 12px;">儲存並追蹤你的陀螺組合</span>`;
    searchEl.placeholder = "搜尋配置名稱 / 零件…";
    return;
  }
  searchEl.placeholder = "搜尋商品代號 / 陀螺 / 零件 / 中文名…";

    wrap.innerHTML = `

      <label><input type="checkbox" ${filterOpts.missingOnly ? "checked" : ""} onchange="filterOpts.missingOnly=this.checked; filterOpts.ownedOnly=false; render()"> 只看缺少</label>

    wrap.innerHTML = `

// 排行榜：blade 名稱比對的時候，把 (BX)/(CX)/(復刻) 等標記跟空白都先剝掉
function tierStripMarkers(s) {
  return s
    .replace(/\s*\([^)]*\)\s*/g, "")
    .replace(/\s*—.*$/, "")
    .replace(/^輔助戰\s+/, "")
    .trim();
}

// 把 chi 欄位的所有可能名字 (港譯/台譯/aka) 列出來，全部去掉 "\"
function bladeAllNames(code) {
  if (code.includes(".") || code.includes("/")) {
    const info = bladeInfo(code);
    const chi = info.names && info.names.chi;
    return chi ? [chi.replace(/\\/g, "")] : [];
  }
  const info = (DB.blade && DB.blade[code]) || (DB.bladeCollab && DB.bladeCollab[code]);
  if (!info || !info.names) return [];
  const out = new Set();
  ["chi", "aka"].forEach(f => {
    const v = info.names[f];
    if (!v) return;
    v.split(/\s+/).forEach(t => { if (t) out.add(t.replace(/\\/g, "")); });
  });
  return [...out];
}

// 找哪個 CX 段名 (chip/metal/main/over/assist/hasbro) 對到此名字。
// 也支援直接以代號比對 (e.g. "W" 對到 assist W，因 assist 沒中文名)。
function findCxSegmentByName(name) {
  const cx = (DB.bladeDivided && DB.bladeDivided.CX) || {};
  const cats = ["chip", "metal", "main", "over", "assist", "hasbro"];
  for (const cat of cats) {
    if (!cx[cat]) continue;
    for (const [code, info] of Object.entries(cx[cat])) {
      const chi = info.names && info.names.chi;
      if (!chi) continue;
      const tokens = chi.split(/\s+/).map(t => t.replace(/\\/g, ""));
      if (tokens.includes(name)) return { code, cat };
    }
  }
  for (const cat of cats) {
    if (cx[cat] && cx[cat][name]) return { code: name, cat };
  }
  return null;
}

// 排行榜戰刃名字 → 是否被任一已擁有戰刃涵蓋
// (單片名字相符；或 CX 組合名 / 段名跟某個擁有的 CX 戰刃對得上)
function tierIsBladeOwned(name, ownedBlades) {
  const stripped = tierStripMarkers(name);
  if (!stripped || !ownedBlades.size) return false;
  const candidates = stripped.split(/\s*\/\s*/).map(s => s.trim()).filter(Boolean);
  for (const cand of candidates) {
    let seg = null;
    for (const code of ownedBlades) {
      if (!code.includes(".") && !code.includes("/")) {
        if (bladeAllNames(code).includes(cand)) return true;
      } else {
        if (bladeName(code) === cand) return true;
        if (seg === null) seg = findCxSegmentByName(cand) || false;
        if (seg && code.split(".").includes(seg.code)) return true;
      }
    }
  }
  // 模糊比對 — 單片
  for (const cand of candidates) {
    for (const code of ownedBlades) {
      if (code.includes(".") || code.includes("/")) continue;
      if (bladeAllNames(code).some(n => n && (n.includes(cand) || cand.includes(n)))) return true;
    }
  }
  return false;
}

// 排行榜戰刃名字 → 跳轉目標。回傳 {kind:"blade",id} 或 {kind:"product",id} 或 null
function tierBladeMatch(name) {
  const stripped = tierStripMarkers(name);
  if (!stripped) return null;
  const candidates = stripped.split(/\s*\/\s*/).map(s => s.trim()).filter(Boolean);
  if (!candidates.length) return null;
  // 1. 完全相符的單片戰刃 (chi/aka 各 token)
  for (const cand of candidates) {
    for (const code of ALL_BLADES) {
      if (code.includes(".") || code.includes("/")) continue;
      if (bladeAllNames(code).includes(cand)) return { kind: "blade", id: code };
    }
  }
  // 2. 完全相符的 CX 組合戰刃 (跳到第一個含此組合的商品)
  for (const cand of candidates) {
    for (const v of VARIANTS) {
      if (isEmptyPart(v.blade)) continue;
      if (!v.blade.includes(".") && !v.blade.includes("/")) continue;
      if (bladeName(v.blade) === cand) return { kind: "product", id: v.productId };
    }
  }
  // 3. CX 段名 fallback (e.g. 狂怒→metal Rg, W→assist W) — 找一個含此段的商品
  for (const cand of candidates) {
    const seg = findCxSegmentByName(cand);
    if (!seg) continue;
    for (const v of VARIANTS) {
      if (isEmptyPart(v.blade) || !v.blade.includes(".")) continue;
      if (v.blade.split(".").includes(seg.code)) return { kind: "product", id: v.productId };
    }
  }
  // 4. 模糊比對 (子字串) — 單片戰刃
  for (const cand of candidates) {
    for (const code of ALL_BLADES) {
      if (code.includes(".") || code.includes("/")) continue;
      const names = bladeAllNames(code);
      if (names.some(n => n && (n.includes(cand) || cand.includes(n)))) return { kind: "blade", id: code };
    }
  }
  return null;
}

function renderTier() {
  const tier = DB.tier || {};
  const op = ownedParts();
  const q = document.getElementById("search").value.trim().toLowerCase();
  const showOwned = filterOpts.ownedOnly;
  const tierOrder = ["T0", "T0.5", "T1", "T1.5", "T2", "T3", "T4", "T5"];

  const matchQuery = (text) => !q || (text && text.toLowerCase().includes(q));

  const renderBladeRow = (label, items) => {
    const filtered = items.filter(matchQuery);
    if (!filtered.length) return "";
    return `<div class="tier-row">
      <span class="tier-label tier-${label.replace(".", "-")}">${label}</span>
      <div class="tier-pills">${filtered.map(name => {
        const m = tierBladeMatch(name);
        const owned = tierIsBladeOwned(name, op.blades);
        const ghost = showOwned && !owned;
        const cls = (showOwned && owned) ? "owned" : (ghost ? "missing" : "");
        if (m) {
          const args = `'${m.kind}','${String(m.id).replace(/'/g, "\\'")}'`;
          return `<span class="tier-pill ${cls}" onclick="tierJumpToBlade(${args})" title="點此跳到對應${m.kind === "product" ? "商品" : "戰刃"}">${name}</span>`;
        }
        return `<span class="tier-pill ${cls}">${name}</span>`;
      }).join("")}</div>
    </div>`;
  };

  const renderPartRow = (label, codes, ownedSet, kind) => {
    const filtered = codes.filter(matchQuery);
    if (!filtered.length) return "";
    return `<div class="tier-row">
      <span class="tier-label tier-${label.replace(".", "-")}">${label}</span>
      <div class="tier-pills">${filtered.map(code => {
        const owned = ownedSet.has(code);
        const ghost = showOwned && !owned;
        const cls = (showOwned && owned) ? "owned" : (ghost ? "missing" : "");
        return `<span class="tier-pill ${cls}" onclick="tierJumpToPart('${code.replace(/'/g, "\\'")}', '${kind}')" title="點此跳到零件">${code}</span>`;
      }).join("")}</div>
    </div>`;
  };

  const toggle = `<div style="display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;">
    <button class="${showOwned ? 'primary' : ''}" onclick="filterOpts.ownedOnly = !filterOpts.ownedOnly; render();">
      ${showOwned ? '✓ ' : ''}標示已擁有
    </button>
  </div>`;

  const bladeSection = `<h2 id="tier-blade" style="margin-top:0;">⚔️ 戰刃 排行榜</h2>` +
    tierOrder.map(t => tier.blade && tier.blade[t] ? renderBladeRow(t, tier.blade[t]) : "").join("");

  const ratchetSection = `<h2 id="tier-ratchet" style="margin-top:24px;">⚙️ 固鎖 排行榜</h2>` +
    tierOrder.map(t => tier.ratchet && tier.ratchet[t] ? renderPartRow(t, tier.ratchet[t], op.ratchets, "ratchet") : "").join("");

  const bitSection = `<h2 id="tier-bit" style="margin-top:24px;">🔩 軸 排行榜</h2>` +
    tierOrder.map(t => tier.bit && tier.bit[t] ? renderPartRow(t, tier.bit[t], op.bits, "bit") : "").join("");

  return `<div>${toggle}${bladeSection}${ratchetSection}${bitSection}</div>`;
}

function tierJumpToPart(code, kind) {
  if (!code) return;
  const set = kind === "bit" ? ALL_BITS : ALL_RATCHETS;
  if (!set.has(code)) return;
  switchTab("parts");
  select(kind, code);
}

function tierJumpToBlade(kind, id) {
  if (!id) return;
  if (kind === "blade") {
    if (!ALL_BLADES.has(id)) return;
    switchTab("parts");
    select("blade", id);
  } else if (kind === "product") {
    if (!PRODUCTS[id]) return;
    switchTab("products");
    select("product", id);
  }
}

function renderProductList(q) {
  const series = {};
  PRODUCT_LIST.forEach(p => {
    const s = productSeries(p.id);
    if (filterOpts.series[s] === false) return;
    if (!series[s]) series[s] = [];
    series[s].push(p);
  });
  const html = [];
  Object.keys(series).sort().forEach(s => {
    const items = series[s].filter(p => productMatches(p, q));
    if (!items.length) return;
    let visible = 0;
    const rows = items.map(p => {
      const ownedV = p.variants.filter(v => isOwned(v.id)).length;
      const total = p.variants.length;
      if (filterOpts.ownedOnly && ownedV === 0) return "";
      if (filterOpts.missingOnly && ownedV === total) return "";
      visible++;
      const cls = (ownedV === total ? "owned" : "") + (selected && selected.type==="product" && selected.id===p.id ? " selected" : "");
      const blades = [...new Set(p.variants
        .map(v => isEmptyPart(v.blade) ? null : bladeName(v.blade))
        .filter(Boolean))];
      const bladesStr = blades.length === 0 ? ""
        : blades.length > 3 ? blades.slice(0, 2).join("、") + ` +${blades.length - 2}`
        : blades.join("、");
      const isSingle = p.variants.length === 1;
      const onlyV = isSingle ? p.variants[0] : null;
      const checkChar = ownedV === total ? "●" : ownedV > 0 ? "◐" : "○";
      const checkClick = isSingle
        ? `event.stopPropagation(); setOwned('${onlyV.id}', ${isOwned(onlyV.id) ? 0 : 1})`
        : "";
      const checkTitle = isSingle ? "點此快速切換擁有/未擁有" : "";
      return `<div class="item ${cls}" onclick="select('product','${p.id}')">
        <span class="check ${isSingle ? "toggleable" : ""}" ${checkClick ? `onclick="${checkClick}"` : ""} title="${checkTitle}">${checkChar}</span>
        <span class="name">${p.id}</span>
        <span style="color:var(--muted); font-size:11px;" title="${p.type}">${productTypeName(p.type)}</span>
        <span style="font-size:11px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${blades.join("、")}">${bladesStr}</span>
        <span class="qty">${ownedV}/${total}</span>
      </div>`;
    }).join("");
    if (visible) {
      const gkey = "products:" + s;
      const collapsed = collapsedGroups.has(gkey);
      html.push(`<div class="group ${collapsed ? "collapsed" : ""}">
        <div class="group-head" onclick="toggleGroup('${gkey}')">
          <span>${s} 系列</span>
          <span class="count">${visible} / ${items.length}</span>
        </div>
        <div class="group-body">${rows}</div>
      </div>`);
    }
  });
  return html.join("") || `<div class="empty">沒有符合條件的商品</div>`;
}

function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

// 代號用「字界開頭」比對 (R 不會撈到 DrSt)，中文用子字串
// 同時把連字符忽略 (UX09 可以命中 UX-09)
function codeMatches(text, q) {
  if (!text) return false;
  const norm = s => s.replace(/-/g, "");
  return new RegExp("(?:^|[^A-Za-z0-9])" + escapeRegex(norm(q)), "i").test(norm(text));
}
function chiMatches(text, q) {
  return text && text.toLowerCase().includes(q.toLowerCase());
}

function productMatches(p, q) {
  if (!q) return true;
  if (codeMatches(p.id, q)) return true;
  return p.variants.some(v => variantMatches(v, q));
}

function variantMatches(v, q) {
  return codeMatches(v.raw, q)
    || chiMatches(bladeName(v.blade), q)
    || chiMatches(bitName(v.bit), q);
}

function renderPartList(q) {
  const op = ownedParts();
  const sections = [
    { key: "blade", title: "戰刃 Blade", items: [...ALL_BLADES].sort(), info: bladeInfo, owned: op.blades },
    { key: "ratchet", title: "固鎖 Ratchet", items: [...ALL_RATCHETS].sort(), info: ratchetInfo, owned: op.ratchets },
    { key: "bit", title: "軸 Bit", items: [...ALL_BITS].sort(), info: bitInfo, owned: op.bits },
  ];
  return sections.map(sec => {
    const filtered = sec.items.filter(code => {
      const isO = sec.owned.has(code);
      if (filterOpts.ownedOnly && !isO) return false;
      if (filterOpts.missingOnly && isO) return false;
      if (q) {
        const info = sec.info(code);
        const chi = info.names ? info.names.chi || "" : "";
        const eng = info.names ? info.names.eng || "" : "";
        if (codeMatches(code, q) || codeMatches(eng, q) || chiMatches(chi, q)) return true;
        // 也用商品代號搜尋: ux09 → 找出 UX-09 包含的零件
        const sources = PART_SOURCES[sec.key][code] || [];
        return sources.some(v => codeMatches(v.productId, q));
      }
      return true;
    });
    if (!filtered.length) return "";
    const gkey = "parts:" + sec.key;
    const collapsed = collapsedGroups.has(gkey);
    return `<div class="group ${collapsed ? "collapsed" : ""}">
      <div class="group-head" onclick="toggleGroup('${gkey}')">
        <span>${sec.title}</span>
        <span class="count">${[...sec.owned].filter(c => sec.items.includes(c)).length} / ${sec.items.length}</span>
      </div>
      <div class="group-body">
        ${filtered.map(code => {
          const info = sec.info(code);
          const isO = sec.owned.has(code);
          const cls = (isO ? "owned" : "") + (selected && selected.type === sec.key && selected.id === code ? " selected" : "");
          const cn = sec.key === "ratchet" ? "" :
                     sec.key === "blade" ? bladeName(code) :
                     bitName(code);
          const display = cn
            ? `${cn} <span style='color:var(--muted); font-family:monospace; font-size:11px;'>${code}</span>`
            : `<span style='font-family:monospace;'>${code}</span>`;
          return `<div class="item ${cls}" onclick="select('${sec.key}','${escapeAttr(code)}')">
            <span class="check">${isO ? "●" : "○"}</span>
            <span class="name">${display}</span>
            <span class="qty">${PART_SOURCES[sec.key][code].length}</span>
          </div>`;
        }).join("")}
      </div>
    </div>`;
  }).join("") || `<div class="empty">沒有符合條件的零件</div>`;
}

function escapeAttr(s) { return s.replace(/'/g, "\\'"); }

function select(type, id) {
  selected = { type, id };
  render();
}

function renderDetail() {
  const el = document.getElementById("detail");
  const back = `<div class="mobile-back-bar"><button onclick="goBack()">← 返回</button></div>`;
  if (activeTab === "mine") { el.innerHTML = back + renderCollection(); return; }
  if (activeTab === "tier") { el.innerHTML = back + renderTier(); return; }
  if (activeTab === "builds") {
    if (!selected) { el.innerHTML = back + `<div class="empty">← 從左側選配置，或按「+ 新增配置」</div>`; return; }
    el.innerHTML = back + renderBuildEditor(selected.id);
    return;
  }
  if (!selected) { el.innerHTML = `<div class="empty">← 從左側清單選一個項目開始</div>`; return; }
  if (selected.type === "product") el.innerHTML = back + renderProductDetail(PRODUCTS[selected.id]);
  else el.innerHTML = back + renderPartDetail(selected.type, selected.id);
}

function renderBuildEditor(id) {
  const b = getBuild(id);
  if (!b) return `<div class="empty">配置不存在</div>`;
  const op = ownedParts();
  const status = buildStatus(b);
  const slot = (key, label, code, info, nameFn, ownedSet) => {
    const inf = code ? info(code) : null;
    const cn = code ? nameFn(code, inf) : "";
    const ow = code && ownedSet.has(code);
    const main = code
      ? `<div style="margin-top:6px; font-size:18px; font-weight:600;">${cn || code}</div>
         <div style="color:var(--muted); font-size:12px; font-family:monospace; margin-top:2px;">
           ${code} ${ow ? `<span class="pill owned">已擁有</span>` : `<span class="pill missing">未擁有</span>`}
         </div>`
      : `<div style="margin-top:6px; color:var(--muted);">— 未選 —</div>`;
    return `<div class="card" style="cursor:pointer" onclick="openPartPicker('${id}','${key}')">
      <div style="display:flex; align-items:baseline; gap:8px;">
        <h3 style="margin:0; font-size:13px; color:var(--accent2);">${label}</h3>
        <span style="margin-left:auto; color:var(--muted); font-size:11px;">${code ? "點此變更" : "點此選擇"} ▸</span>
      </div>
      ${main}
      ${code && code !== "" ? `<button onclick="event.stopPropagation(); updateBuildField('${id}','${key}',''); render();" style="margin-top:8px; font-size:11px; padding:3px 8px;" class="danger">清除</button>` : ""}
    </div>`;
  };
  const statusPill = status.need === 0
    ? `<span class="pill" style="background:var(--panel2);">尚未選擇任何零件</span>`
    : status.complete ? `<span class="pill owned">✓ 全部擁有，可組裝</span>`
    : `<span class="pill missing">缺 ${status.missing} 件 / ${status.need}</span>`;
  return `<div>
    <div style="display:flex; gap:8px; margin-bottom:14px; align-items:center; flex-wrap:wrap;">
      <input type="text" placeholder="配置名稱 (例: 蒼龍爆刃)" value="${(b.name || '').replace(/"/g, '&quot;')}"
             oninput="updateBuildField('${id}','name', this.value)"
             style="flex:1; min-width:160px; padding:8px 10px; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:6px;">
      <button onclick="duplicateBuild('${id}')">🔁 複製</button>
      <button class="danger" onclick="deleteBuild('${id}')">🗑 刪除</button>
    </div>
    <div style="margin-bottom:12px;">${statusPill}</div>
    ${slot("blade", "⚔️ 戰刃", b.blade, bladeInfo, (c) => bladeName(c), op.blades)}
    ${slot("ratchet", "⚙️ 固鎖", b.ratchet, ratchetInfo, () => "", op.ratchets)}
    ${slot("bit", "🔩 軸", b.bit, bitInfo,
      (c, i) => preferredChi(i && i.names && i.names.chi), op.bits)}
    <textarea placeholder="備註 (選填，例: 攻擊型、台場限定…)"
              oninput="updateBuildField('${id}','note', this.value)"
              style="width:100%; min-height:60px; margin-top:14px; padding:8px; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:6px; font-family:inherit;">${(b.note || '').replace(/</g, '&lt;')}</textarea>
  </div>`;
}

let pickerCtx = null;
function openPartPicker(buildId, slot) {
  pickerCtx = { buildId, slot, query: "", onlyOwned: false };
  const slotName = slot === "blade" ? "戰刃" : slot === "ratchet" ? "固鎖" : "軸";
  // 只在開啟時 build 一次 modal 殼，後續搜尋只更新內部 list (避免 input 失焦)
  showModal(`選擇 ${slotName}`, `
    <div style="display:flex; gap:8px; margin-bottom:8px; align-items:center; flex-wrap:wrap;">
      <input type="search" id="picker-q" placeholder="搜尋代號 / 中文名 / 商品代號 (例: UX01)"
             oninput="pickerCtx.query = this.value; renderPartPickerList();"
             style="flex:1; min-width:160px; padding:8px; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:6px;">
      <label style="display:flex; align-items:center; gap:4px; color:var(--muted); font-size:12px; white-space:nowrap;">
        <input type="checkbox" id="picker-owned" onchange="pickerCtx.onlyOwned = this.checked; renderPartPickerList();"> 只看擁有
      </label>
    </div>
    <div id="picker-list" style="max-height: 50vh; overflow:auto; border:1px solid var(--border); border-radius:6px;"></div>
  `, [
    { label: "取消", action: () => { pickerCtx = null; closeModal(); } }
  ]);
  renderPartPickerList();
  setTimeout(() => { const e = document.getElementById("picker-q"); if (e) e.focus(); }, 30);
}

function renderPartPickerList() {
  const ctx = pickerCtx; if (!ctx) return;
  const listEl = document.getElementById("picker-list"); if (!listEl) return;
  const op = ownedParts();
  const all = ctx.slot === "blade" ? [...ALL_BLADES] : ctx.slot === "ratchet" ? [...ALL_RATCHETS] : [...ALL_BITS];
  const ownedSet = ctx.slot === "blade" ? op.blades : ctx.slot === "ratchet" ? op.ratchets : op.bits;
  const info = ctx.slot === "blade" ? bladeInfo : ctx.slot === "ratchet" ? ratchetInfo : bitInfo;
  const nameFn = ctx.slot === "ratchet" ? () => "" : (c) => ctx.slot === "blade" ? bladeName(c) : bitName(c);
  const filtered = all.filter(c => {
    if (ctx.onlyOwned && !ownedSet.has(c)) return false;
    if (!ctx.query) return true;
    const inf = info(c);
    const chi = inf.names ? inf.names.chi || "" : "";
    const eng = inf.names ? inf.names.eng || "" : "";
    if (codeMatches(c, ctx.query) || codeMatches(eng, ctx.query) || chiMatches(chi, ctx.query)) return true;
    // 也以商品代號搜尋: UX-01 / UX01 → 找出 UX-01 包含的所有零件
    const sources = PART_SOURCES[ctx.slot][c] || [];
    return sources.some(v => codeMatches(v.productId, ctx.query));
  }).sort();
  if (filtered.length === 0) {
    listEl.innerHTML = `<div class="empty" style="padding:20px;">沒有符合條件</div>`;
    return;
  }
  listEl.innerHTML = filtered.map(c => {
    const inf = info(c);
    const cn = nameFn(c, inf);
    const ow = ownedSet.has(c);
    return `<div class="item ${ow ? 'owned' : ''}" style="padding:8px 12px; cursor:pointer;" onclick="pickPart('${escapeAttr(c)}')">
      <span class="check">${ow ? '●' : '○'}</span>
      <span class="name">${cn || c}</span>
      ${cn ? `<span style="margin-left:auto; color:var(--muted); font-family:monospace; font-size:11px;">${c}</span>` : ''}
    </div>`;
  }).join("");
}
function pickPart(code) {
  const ctx = pickerCtx; if (!ctx) return;
  const b = getBuild(ctx.buildId); if (!b) return;
  b[ctx.slot] = code;
  saveState();
  pickerCtx = null;
  closeModal();
  render();
}

function goBack() {
  if (activeTab === "mine") { switchTab("products"); return; }
  if (activeTab === "tier") { switchTab("products"); return; }
  selected = null;
  render();
}

function renderCollection() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const op = ownedParts();
  const ownedProducts = PRODUCT_LIST.filter(p => p.variants.some(v => isOwned(v.id)));

  // 商品段
  const productsHtml = ownedProducts.length === 0
    ? `<div class="empty" style="padding: 20px;">還沒有任何擁有的商品</div>`
    : ownedProducts
        .filter(p => !q || codeMatches(p.id, q) || p.variants.some(v => isOwned(v.id) && variantMatches(v, q)))
        .map(p => {
          const ownedVars = p.variants.filter(v => isOwned(v.id));
          return `<div class="card" style="cursor:pointer" onclick="switchTab('products'); select('product','${p.id}')">
            <div style="display:flex; align-items:baseline; gap:8px;">
              <h3 style="margin:0; color: var(--text);">${productTypeName(p.type)}</h3>
              <span style="color:var(--muted); font-size:12px; font-family:monospace;">${p.id}</span>
              <span class="pill owned" style="margin-left:auto;">${ownedVars.length}/${p.variants.length}</span>
            </div>
            <div style="margin-top:6px; font-size:12px;">
              ${ownedVars.map(v => {
                const bChi = isEmptyPart(v.blade) ? "—" : (bladeName(v.blade) || v.blade);
                const rDisp = isEmptyPart(v.ratchet) ? "—" : v.ratchet;
                const bitC = isEmptyPart(v.bit) ? "—" : (bitName(v.bit) || v.bit);
                const codeStr = [isEmptyPart(v.blade)?"—":v.blade, rDisp, isEmptyPart(v.bit)?"—":v.bit].join(" ");
                const qty = ownedQty(v.id);
                return `<div style="margin-bottom:4px;">
                  <div>${bChi} · ${rDisp} · ${bitC}${qty > 1 ? ` <span style="color:var(--muted)">×${qty}</span>` : ""}</div>
                  <div style="color:var(--muted); font-size:11px; font-family:monospace;">${codeStr}</div>
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("");

  // 零件段
  const partSection = (title, anchor, ownedSet, info, nameFn) => {
    const items = [...ownedSet].sort();
    if (items.length === 0) {
      return `<h2 id="${anchor}" style="margin-top:24px;">${title} <span class="pill" style="font-size:12px;">0</span></h2>
        <div class="empty" style="padding: 20px;">還沒有任何擁有的零件</div>`;
    }
    const filtered = q ? items.filter(c => {
      const inf = info(c);
      const chi = inf.names ? inf.names.chi || "" : "";
      const eng = inf.names ? inf.names.eng || "" : "";
      return codeMatches(c, q) || codeMatches(eng, q) || chiMatches(chi, q);
    }) : items;
    return `<h2 id="${anchor}" style="margin-top:24px;">${title} <span class="pill" style="font-size:12px;">${items.length}</span></h2>` +
      filtered.map(code => {
        const inf = info(code);
        const sources = (PART_SOURCES[anchor.replace("mine-","")][code] || []);
        const ownedSources = sources.filter(v => isOwned(v.id));
        const display = nameFn(code, inf);
        const headPrimary = display || code;
        const headSub = display ? code : "";
        return `<div class="card">
          <div style="display:flex; align-items:baseline; gap:8px;">
            <h3 style="margin:0; color:var(--text);">${headPrimary}</h3>
            ${headSub ? `<span style="color: var(--muted); font-size:12px; font-family:monospace;">${headSub}</span>` : ""}
          </div>
          <div style="margin-top:8px;">
            <div style="color: var(--muted); font-size:11px; margin-bottom:4px;">來自（已擁有 ${ownedSources.length} / ${sources.length}）：</div>
            <div class="source-list">
              ${sources.map(v => `<span class="src ${isOwned(v.id) ? "owned" : ""}" onclick="switchTab('products'); select('product','${v.productId}')" title="${productTypeName(PRODUCTS[v.productId].type)}">${v.productId} · ${variantDisplayChi(v)}</span>`).join("")}
            </div>
          </div>
        </div>`;
      }).join("");
  };

  const bladeSec = partSection("⚔️ 戰刃", "mine-blade", op.blades, bladeInfo,
    (c) => bladeName(c));
  const ratchetSec = partSection("⚙️ 固鎖", "mine-ratchet", op.ratchets, ratchetInfo, () => "");
  const bitSec = partSection("🔩 軸", "mine-bit", op.bits, bitInfo,
    (c, inf) => inf.names && inf.names.chi || "");

  const toggle = `<div style="display:flex; gap:6px; margin-bottom:14px;">
    <button class="${mineView === 'detail' ? 'primary' : ''}" onclick="setMineView('detail')">📋 卡片</button>
    <button class="${mineView === 'table' ? 'primary' : ''}" onclick="setMineView('table')">📊 表格</button>
  </div>`;

  if (mineView === "table") return `<div>${toggle}${renderCollectionTable(q)}</div>`;

  return `<div>${toggle}
    <h2 id="mine-products" style="margin-top:0;">🌀 陀螺戰士 <span class="pill" style="font-size:12px;">${ownedProducts.length}</span></h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px;">${productsHtml}</div>
    ${bladeSec}
    ${ratchetSec}
    ${bitSec}
  </div>`;
}

function renderCollectionTable(q) {
  const op = ownedParts();
  const tableSec = (title, ownedSet, info, nameFn, key) => {
    const all = [...ownedSet].sort();
    const items = q ? all.filter(c => {
      const inf = info(c);
      const chi = inf.names ? inf.names.chi || "" : "";
      const eng = inf.names ? inf.names.eng || "" : "";
      return codeMatches(c, q) || codeMatches(eng, q) || chiMatches(chi, q);
    }) : all;
    const total = all.length;
    if (!total) return `<h3 style="margin-top:24px;">${title} <span class="pill" style="font-size:12px;">0</span></h3>
      <div class="empty" style="padding:14px;">還沒有任何擁有的零件</div>`;
    return `<h3 style="margin-top:24px;">${title} <span class="pill" style="font-size:12px;">${total}</span></h3>
      <table style="width:100%; border-collapse:collapse; font-size:13px;">
        <thead>
          <tr style="text-align:left; font-size:11px; color:var(--muted); border-bottom:1px solid var(--border);">
            <th style="padding:6px 8px; width: 38%;">中文名</th>
            <th style="padding:6px 8px; width: 18%;">代號</th>
            <th style="padding:6px 8px; width: 10%; text-align:right;">擁有</th>
            <th style="padding:6px 8px;">來自</th>
          </tr>
        </thead>
        <tbody>
          ${items.map(code => {
            const inf = info(code);
            const cn = nameFn(code, inf);
            const sources = PART_SOURCES[key][code] || [];
            const ownedSrc = sources.filter(v => isOwned(v.id));
            const totalQty = ownedSrc.reduce((s, v) => s + ownedQty(v.id), 0);
            const productIds = [...new Set(ownedSrc.map(v => v.productId))];
            return `<tr style="border-bottom:1px solid var(--border);">
              <td style="padding:6px 8px;">${cn || "—"}</td>
              <td style="padding:6px 8px; font-family:monospace; color:var(--muted); font-size:12px;">${code}</td>
              <td style="padding:6px 8px; text-align:right; color:var(--owned); font-weight:600;">${totalQty}</td>
              <td style="padding:6px 8px;">
                <div class="source-list">
                  ${productIds.map(pid => `<span class="src owned" onclick="switchTab('products'); select('product','${pid}')" title="${productTypeName(PRODUCTS[pid].type)}">${pid}</span>`).join("")}
                </div>
              </td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>`;
  };

  return tableSec("⚔️ 戰刃", op.blades, bladeInfo,
    (c) => bladeName(c), "blade") +
    tableSec("⚙️ 固鎖", op.ratchets, ratchetInfo, () => "", "ratchet") +
    tableSec("🔩 軸", op.bits, bitInfo,
    (c, inf) => preferredChi(inf.names && inf.names.chi), "bit");
}

function renderProductDetail(p) {
  if (!p) return `<div class="empty">找不到商品</div>`;
  const ownedV = p.variants.filter(v => isOwned(v.id)).length;
  const variants = p.variants.map((v, i) => {
    const codeStr = [
      isEmptyPart(v.blade) ? "—" : v.blade,
      isEmptyPart(v.ratchet) ? "—" : v.ratchet,
      isEmptyPart(v.bit) ? "—" : v.bit,
    ].join(" ");
    const blade = isEmptyPart(v.blade) ? null : bladeInfo(v.blade);
    const bChi = blade ? (bladeName(v.blade) || v.blade) : "—";
    const ratchetDisplay = isEmptyPart(v.ratchet) ? "—" : v.ratchet;
    const bitChi = isEmptyPart(v.bit) ? "—" : (bitName(v.bit) || v.bit);
    const cnDisplay = `${bChi} · ${ratchetDisplay} · ${bitChi}`;
    const meta = [];
    if (v.opts.get)  meta.push(`每箱 ${v.opts.get} 盒`);
    if (v.opts.coat) meta.push(`配色 ${v.opts.coat}`);
    const qty = ownedQty(v.id);
    const owned = qty > 0;
    return `<div class="variant ${owned ? "owned" : ""}">
      <span class="badge">${owned ? "✓ 擁有" : "—"}</span>
      <div>
        <div class="vbey">${cnDisplay}</div>
        <div class="vparts" style="font-family:monospace;">${codeStr}</div>
        ${meta.length ? `<div class="vparts">${meta.join(" · ")}</div>` : ""}
      </div>
      <button onclick="setOwned('${v.id}', ${qty - 1})" ${qty <= 0 ? "disabled" : ""}>−</button>
      <input type="number" class="vqty" min="0" value="${qty}" onchange="setOwned('${v.id}', this.value)">
      <button onclick="setOwned('${v.id}', ${qty + 1})">＋</button>
    </div>`;
  }).join("");
  return `<div>
    <h2>${p.id} <span style="color:var(--muted); font-size: 13px;" title="${p.type}">${productTypeName(p.type)}</span></h2>
    <div class="sub">擁有 ${ownedV}/${p.variants.length} 陀螺</div>
    <div class="variants">${variants}</div>
  </div>`;
}

function renderPartDetail(type, code) {
  const info = type === "blade" ? bladeInfo(code) : type === "ratchet" ? ratchetInfo(code) : bitInfo(code);
  const sources = PART_SOURCES[type][code] || [];
  const owned = sources.some(v => isOwned(v.id));
  const names = info.names || {};
  const attr = info.attr || [];
  const stat = info.stat || [];
  const primary = preferredChi(names.chi) || code;
  return `<div>
    <h2>
      ${primary}
      <span class="pill ${owned ? "owned" : "missing"}">${owned ? "已擁有" : "缺少"}</span>
    </h2>
    <div class="sub" style="font-family:monospace;">${code}</div>
    <div class="sub">${type === "blade" ? "戰刃 Blade" : type === "ratchet" ? "固鎖 Ratchet" : "軸 Bit"}</div>

    ${type === "bit" ? `<div class="bit-img-wrap">
      <img class="bit-img" src="${bitImageSrc(code)}" alt="${code}"
           onerror="this.parentElement.style.display='none'">
    </div>` : ""}

    <div class="card">
      <h3>零件資訊</h3>
      ${names.jap ? `<div class="row"><span class="k">日文</span><span class="v">${names.jap}</span></div>` : ""}
      ${names.eng ? `<div class="row"><span class="k">英文</span><span class="v">${names.eng}</span></div>` : ""}
      ${names.chi ? `<div class="row"><span class="k">中文</span><span class="v">${names.chi.replace(/\\/g, "")}</span></div>` : ""}
      ${attr.length ? `<div class="row"><span class="k">屬性</span><span class="v">${attr.map(a => `<span class="pill ${a}">${a}</span>`).join("")}</span></div>` : ""}
      ${stat.length ? `<div class="row"><span class="k">數據</span><span class="v" style="font-family:monospace">${stat.join(" / ")}</span></div>` : ""}
      ${info.desc ? `<div class="desc">${info.desc}</div>` : ""}
    </div>

    <div class="card">
      <h3>來自哪些商品（${sources.filter(v => isOwned(v.id)).length}/${sources.length} 已擁有）</h3>
      <div class="source-list">
        ${sources.map(v => `<span class="src ${isOwned(v.id) ? "owned" : ""}" onclick="select('product','${v.productId}')">${v.productId} · ${variantDisplayChi(v)}</span>`).join("")}
      </div>
    </div>
  </div>`;
}

// gzip + base64 編解碼 (用於「短碼」格式)
const SHORT_PREFIX = "BEYX1:";
async function compressToShortCode(jsonStr) {
  const stream = new Blob([jsonStr]).stream().pipeThrough(new CompressionStream("gzip"));
  const buf = new Uint8Array(await new Response(stream).arrayBuffer());
  let bin = ""; for (let i = 0; i < buf.length; i++) bin += String.fromCharCode(buf[i]);
  return SHORT_PREFIX + btoa(bin);
}
async function decompressFromShortCode(code) {
  // iOS 會把前綴轉小寫；用 regex 不分大小寫剝掉任何 "xxxN:" 開頭
  const b64 = code.replace(/^[A-Za-z]+\d*:/i, "").replace(/\s+/g, "");
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  return await new Response(stream).text();
}
function looksLikeShortCode(s) {
  return /^[A-Za-z]+\d*:/i.test(s) || (!s.startsWith("{") && /^[A-Za-z0-9+/=\s]+$/.test(s));
}

let exportFormat = "json"; // json | short

function openExport() {
  showModal("匯出收藏", `
    <div style="display:flex; gap:6px; margin-bottom:10px;">
      <button id="fmt-json" class="${exportFormat === 'json' ? 'primary' : ''}" onclick="switchExportFormat('json')">📄 JSON (完整)</button>
      <button id="fmt-short" class="${exportFormat === 'short' ? 'primary' : ''}" onclick="switchExportFormat('short')">📦 短碼 (壓縮)</button>
    </div>
    <p style="color:var(--muted); margin:0 0 6px; font-size:12px;" id="fmt-hint"></p>
    <textarea class="io" id="io-text" readonly></textarea>
  `, [
    { label: "📋 複製", action: () => {
      navigator.clipboard.writeText(document.getElementById("io-text").value);
      alert("已複製到剪貼簿");
    }},
    { label: "💾 下載", primary: true, action: () => {
      const ext = exportFormat === "json" ? "json" : "txt";
      const blob = new Blob([document.getElementById("io-text").value], { type: "text/plain" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `beyx-collection-${new Date().toISOString().slice(0, 10)}.${ext}`;
      a.click();
    }},
    { label: "關閉", action: closeModal },
  ]);
  switchExportFormat(exportFormat);
}

async function switchExportFormat(fmt) {
  exportFormat = fmt;
  const btnJ = document.getElementById("fmt-json");
  const btnS = document.getElementById("fmt-short");
  if (btnJ && btnS) {
    btnJ.classList.toggle("primary", fmt === "json");
    btnS.classList.toggle("primary", fmt === "short");
  }
  const exportData = {
    schema: "beyx_collection", version: 1,
    exportedAt: new Date().toISOString(),
    owned: state.owned,
    builds: state.builds || [],
  };
  const json = JSON.stringify(exportData, null, fmt === "json" ? 2 : 0);
  const ta = document.getElementById("io-text");
  const hint = document.getElementById("fmt-hint");
  if (fmt === "json") {
    ta.value = json;
    hint.textContent = `JSON 格式，${json.length} 字元。可直接看內容、易於版本控制。`;
  } else {
    ta.value = "壓縮中…";
    const code = await compressToShortCode(JSON.stringify({ schema: "beyx_collection", version: 1, owned: state.owned, builds: state.builds || [] }));
    ta.value = code;
    hint.textContent = `短碼格式，${code.length} 字元 (壓縮率 ${(code.length / json.length * 100).toFixed(0)}%)。一行字串，方便分享/備份。`;
  }
}

function openImport() {
  showModal("匯入收藏", `
    <p style="color:var(--muted); margin-top:0;">貼上之前匯出的 <b>JSON 內容</b>或 <b>短碼</b>(以 BEYX1: 開頭)。也可以選擇檔案。</p>
    <div style="display:flex; gap:6px; margin-bottom:8px; align-items:center; flex-wrap:wrap;">
      <button type="button" onclick="pasteIntoImport()" style="white-space:nowrap; flex-shrink:0;">📋 從剪貼簿貼上</button>
      <input type="file" accept=".json,.txt,application/json,text/plain" onchange="loadFile(this.files[0])" style="flex:1; min-width:140px;">
    </div>
    <textarea class="io" id="io-text" placeholder='{"owned": {"BX-35#3": 1, ...}}  或  BEYX1:H4sIAAAAAA...'></textarea>
    <div style="color: var(--warn); font-size: 12px; margin-top: 6px;" id="io-warn"></div>
  `, [
    { label: "🔁 取代", primary: true, action: () => doImport(true) },
    { label: "➕ 合併", action: () => doImport(false) },
    { label: "取消", action: closeModal },
  ]);
}

async function pasteIntoImport() {
  const ta = document.getElementById("io-text");
  const warn = document.getElementById("io-warn");
  warn.textContent = "";
  try {
    const text = await navigator.clipboard.readText();
    if (text) { ta.value = text; ta.focus(); }
    else warn.textContent = "剪貼簿是空的";
  } catch (e) {
    warn.textContent = "無法讀取剪貼簿，請改用長按手動貼上 (" + e.message + ")";
  }
}

function loadFile(f) {
  if (!f) return;
  const r = new FileReader();
  r.onload = () => { document.getElementById("io-text").value = r.result; };
  r.readAsText(f);
}

async function doImport(replace) {
  const txt = document.getElementById("io-text").value.trim();
  if (!txt) return;
  const warnEl = document.getElementById("io-warn");
  let json = txt;
  if (looksLikeShortCode(txt)) {
    try { json = await decompressFromShortCode(txt); }
    catch (e) { warnEl.textContent = "短碼解壓失敗：" + e.message; return; }
  }
  let data;
  try { data = JSON.parse(json); }
  catch (e) { warnEl.textContent = "解析失敗：" + e.message; return; }
  const owned = data.owned || data;
  if (typeof owned !== "object") {
    warnEl.textContent = "找不到 owned 欄位";
    return;
  }
  const validIds = new Set(VARIANTS.map(v => v.id));
  const next = replace ? {} : { ...state.owned };
  let added = 0, skipped = 0;
  Object.entries(owned).forEach(([k, v]) => {
    const qty = parseInt(v) || 0;
    if (qty <= 0) return;
    if (!validIds.has(k)) { skipped++; return; }
    next[k] = qty;
    added++;
  });
  state.owned = next;
  // 一併匯入配置 (builds)
  if (Array.isArray(data.builds)) {
    state.builds = replace ? data.builds : [...(state.builds || []), ...data.builds];
  }
  saveState();
  closeModal();
  render();
  alert(`匯入完成：套用 ${added} 筆${skipped ? `，略過 ${skipped} 筆無效 id` : ""}` +
    (Array.isArray(data.builds) ? `\n配置：${data.builds.length} 筆` : ""));
}

function clearAll() {
  if (!confirm("確定要清空所有擁有紀錄？")) return;
  state.owned = {};
  saveState();
  render();
}

// 分享 (匯出成圖片)

let _shareBlob = null;

function openShare() {
  const canShare = !!(navigator.canShare && window.File);
  showModal("分享收藏", `
    <div style="color: var(--muted); font-size: 12px; margin-bottom: 10px;">
      把目前收藏摘要做成 PNG 圖片，方便存到相簿或分享。
    </div>
    <div style="margin-bottom: 10px;">
      <label style="display:block; color: var(--muted); font-size: 12px; margin-bottom: 4px;">標題（留空使用預設）</label>
      <input type="text" id="share-title" placeholder="Beyblade X 收藏" oninput="_scheduleSharePreview()" style="width:100%; padding:8px 10px; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:6px;">
    </div>
    <label style="display: flex; align-items: center; gap: 6px; margin-bottom: 12px; cursor: pointer;">
      <input type="checkbox" id="share-include-code" onchange="updateSharePreview()">
      <span>包含匯入用短碼 (拍照即可給朋友匯入收藏)</span>
    </label>
    <div id="share-preview" style="background:#0f1115; border:1px solid var(--border); border-radius:8px; padding:8px; min-height:140px; max-height:50vh; overflow:auto; text-align:center; color:var(--muted);">
      產生中…
    </div>
  `, [
    { label: "💾 下載", primary: true, action: downloadShareImage },
    ...(canShare ? [{ label: "🔗 分享…", action: shareImageNow }] : []),
    { label: "關閉", action: closeModal },
  ]);
  _shareBlob = null;
  updateSharePreview();
}

let _shareDebounce = null;
function _scheduleSharePreview() {
  clearTimeout(_shareDebounce);
  _shareDebounce = setTimeout(updateSharePreview, 250);
}

async function updateSharePreview() {
  clearTimeout(_shareDebounce);
  const previewEl = document.getElementById("share-preview");
  if (!previewEl) return;
  previewEl.innerHTML = `<div style="padding:30px; color:var(--muted);">產生中…</div>`;
  _shareBlob = null;
  const includeCode = !!document.getElementById("share-include-code")?.checked;
  const customTitle = (document.getElementById("share-title")?.value || "").trim();
  try {
    const blob = await buildShareImageBlob({ includeCode, customTitle });
    _shareBlob = blob;
    const url = URL.createObjectURL(blob);
    previewEl.innerHTML = `<img src="${url}" style="max-width:100%; height:auto; border-radius:6px;">`;
    const img = previewEl.querySelector("img");
    img.onload = () => URL.revokeObjectURL(url);
  } catch (e) {
    previewEl.innerHTML = `<div style="padding:30px; color:var(--missing);">產生失敗：${e.message}</div>`;
  }
}

function downloadShareImage() {
  if (!_shareBlob) { alert("圖片尚未產生"); return; }
  const url = URL.createObjectURL(_shareBlob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `beyx-collection-${new Date().toISOString().slice(0, 10)}.png`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function shareImageNow() {
  if (!_shareBlob) { alert("圖片尚未產生"); return; }
  const file = new File([_shareBlob], `beyx-collection-${new Date().toISOString().slice(0,10)}.png`, { type: "image/png" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: "Beyblade X 收藏" });
    } catch (e) {
      if (e.name !== "AbortError") alert("分享失敗：" + e.message);
    }
  } else {
    downloadShareImage();
  }
}

// 直接畫到 canvas (避開 SVG foreignObject 在 Safari 的限制)
async function buildShareImageBlob(opts) {
  const { includeCode, customTitle } = opts || {};
  const title = (customTitle && customTitle.trim()) || "Beyblade X 收藏";
  const op = ownedParts();
  const ownedProds = PRODUCT_LIST.filter(p => p.variants.some(v => isOwned(v.id)));
  const ownedVarCount = Object.keys(state.owned).length;
  const dateStr = new Date().toISOString().slice(0, 10);

  const bySeries = {};
  ownedProds.forEach(p => {
    const s = productSeries(p.id);
    (bySeries[s] = bySeries[s] || []).push(p);
  });
  const seriesKeys = Object.keys(bySeries).sort();
  const ownedRatchets = [...op.ratchets].sort();
  const ownedBits = [...op.bits].sort();

  let shortCode = "";
  if (includeCode) {
    shortCode = await compressToShortCode(JSON.stringify({
      schema: "beyx_collection", version: 1,
      owned: state.owned, builds: state.builds || [],
    }));
  }

  const W = 1080;
  const PADX = 60, PADTOP = 50, PADBOT = 50;
  const INNER = W - PADX * 2;
  const FFAM = `-apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif`;
  const f = (sz, w) => `${w ? w + " " : ""}${sz}px ${FFAM}`;
  const FONT_TITLE   = f(44, 700);
  const FONT_DATE    = f(20);
  const FONT_LABEL   = f(16);
  const FONT_NUM     = f(34, 700);
  const FONT_TOT     = f(18);
  const FONT_SECTION = f(24, 600);
  const FONT_SERIES  = f(15);
  const FONT_PILL    = f(16);
  const FONT_FOOTER  = f(13);
  const FONT_CODE    = `13px ui-monospace, SFMono-Regular, Menlo, monospace`;
  const C = {
    bg: "#0f1115", panel: "#1f232c", text: "#e6e9ef", muted: "#8a93a3",
    accent2: "#7cf", owned: "#2ecc71", border: "#2a2f3a", code: "#c0c4cd",
  };

  // 用 dummy ctx 量字寬
  const mctx = document.createElement("canvas").getContext("2d");
  function tw(text, font) { mctx.font = font; return mctx.measureText(text).width; }

  function layoutPills(items, getText, font, padX = 14, height = 32, gap = 8, maxWidth = INNER) {
    const rows = [[]];
    let curW = 0;
    for (const it of items) {
      const w = tw(getText(it), font) + padX * 2;
      if (curW > 0 && curW + gap + w > maxWidth) { rows.push([]); curW = 0; }
      rows[rows.length - 1].push({ item: it, w, h: height, label: getText(it) });
      curW += (curW > 0 ? gap : 0) + w;
    }
    return { rows, totalH: rows.length * height + (rows.length - 1) * gap };
  }

  function wrapMono(text, font, maxWidth) {
    const lines = [];
    let cur = "";
    for (const ch of text) {
      const test = cur + ch;
      if (tw(test, font) > maxWidth) { lines.push(cur); cur = ch; }
      else cur = test;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  // 量高度
  const sections = [];
  sections.push({ kind: "header", h: 56 + 30 });
  sections.push({ kind: "stats", h: 96 + 32 });
  sections.push({ kind: "section-h", text: `擁有商品 ${ownedProds.length}`, h: 32 + 14 });
  if (ownedProds.length === 0) {
    sections.push({ kind: "empty", text: "還沒有任何擁有紀錄", h: 32 });
  } else {
    for (const sk of seriesKeys) {
      const layout = layoutPills(bySeries[sk], p => p.id, FONT_PILL);
      sections.push({ kind: "series", series: sk, layout, h: 22 + 10 + layout.totalH + 14 });
    }
  }
  if (ownedRatchets.length) {
    const layout = layoutPills(ownedRatchets, c => c, FONT_PILL);
    sections.push({ kind: "section-h", text: `擁有固鎖 ${ownedRatchets.length}`, h: 32 + 14 });
    sections.push({ kind: "pills", layout, h: layout.totalH + 14 });
  }
  if (ownedBits.length) {
    const layout = layoutPills(ownedBits, c => c, FONT_PILL);
    sections.push({ kind: "section-h", text: `擁有軸 ${ownedBits.length}`, h: 32 + 14 });
    sections.push({ kind: "pills", layout, h: layout.totalH + 14 });
  }
  let codeLines = null;
  if (shortCode) {
    codeLines = wrapMono(shortCode, FONT_CODE, INNER);
    const h = 24 + 24 + 8 + codeLines.length * 18 + 8;
    sections.push({ kind: "code", lines: codeLines, h });
  }
  sections.push({ kind: "footer", h: 24 });

  const contentH = sections.reduce((a, s) => a + s.h, 0);
  const H = PADTOP + contentH + PADBOT;

  // 畫
  const canvas = document.createElement("canvas");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);

  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);

  function drawText(text, x, y, font, color, baseline = "top", align = "left") {
    ctx.font = font;
    ctx.fillStyle = color;
    ctx.textBaseline = baseline;
    ctx.textAlign = align;
    ctx.fillText(text, x, y);
  }
  function roundRectPath(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  let y = PADTOP;
  for (const s of sections) {
    if (s.kind === "header") {
      // 標題太長就縮字級避免被日期擠到
      const dateW = tw(dateStr, FONT_DATE);
      const maxTitleW = INNER - dateW - 20;
      let titleFont = FONT_TITLE;
      let titleSize = 44;
      while (tw(title, titleFont) > maxTitleW && titleSize > 22) {
        titleSize -= 2;
        titleFont = f(titleSize, 700);
      }
      drawText(title, PADX, y, titleFont, C.text, "top", "left");
      drawText(dateStr, W - PADX, y + 12, FONT_DATE, C.muted, "top", "right");
    } else if (s.kind === "stats") {
      const gap = 12;
      const boxW = (INNER - gap * 3) / 4;
      const boxH = 96;
      const stats = [
        ["陀螺戰士", ownedVarCount, VARIANTS.length],
        ["戰刃", op.blades.size, ALL_BLADES.size],
        ["固鎖", op.ratchets.size, ALL_RATCHETS.size],
        ["軸", op.bits.size, ALL_BITS.size],
      ];
      stats.forEach(([label, n, t], i) => {
        const x = PADX + i * (boxW + gap);
        ctx.fillStyle = C.panel;
        roundRectPath(x, y, boxW, boxH, 12);
        ctx.fill();
        drawText(label, x + boxW / 2, y + 22, FONT_LABEL, C.muted, "top", "center");
        const numStr = String(n);
        const totStr = " / " + t;
        const numW = tw(numStr, FONT_NUM);
        const totW = tw(totStr, FONT_TOT);
        const totalW = numW + totW;
        const sx = x + (boxW - totalW) / 2;
        drawText(numStr, sx, y + 50, FONT_NUM, C.owned, "top", "left");
        drawText(totStr, sx + numW, y + 64, FONT_TOT, C.muted, "top", "left");
      });
    } else if (s.kind === "section-h") {
      drawText(s.text, PADX, y, FONT_SECTION, C.accent2, "top", "left");
    } else if (s.kind === "empty") {
      drawText(s.text, PADX, y, FONT_PILL, C.muted, "top", "left");
    } else if (s.kind === "series" || s.kind === "pills") {
      let py = y;
      if (s.kind === "series") {
        drawText(s.series, PADX, y, FONT_SERIES, C.muted, "top", "left");
        py = y + 22 + 10;
      }
      const gap = 8;
      for (const row of s.layout.rows) {
        let px = PADX;
        for (const pill of row) {
          ctx.fillStyle = "rgba(46,204,113,0.15)";
          roundRectPath(px, py, pill.w, pill.h, pill.h / 2);
          ctx.fill();
          ctx.strokeStyle = C.owned;
          ctx.lineWidth = 1;
          roundRectPath(px + 0.5, py + 0.5, pill.w - 1, pill.h - 1, (pill.h - 1) / 2);
          ctx.stroke();
          drawText(pill.label, px + pill.w / 2, py + pill.h / 2 + 1, FONT_PILL, C.owned, "middle", "center");
          px += pill.w + gap;
        }
        py += 32 + gap;
      }
    } else if (s.kind === "code") {
      ctx.strokeStyle = C.border;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(PADX, y + 0.5);
      ctx.lineTo(W - PADX, y + 0.5);
      ctx.stroke();
      drawText("匯入用短碼", PADX, y + 22, FONT_LABEL, C.muted, "top", "left");
      let cy = y + 22 + 24 + 8;
      for (const line of s.lines) {
        drawText(line, PADX, cy, FONT_CODE, C.code, "top", "left");
        cy += 18;
      }
    } else if (s.kind === "footer") {
      drawText("beyblade-collection", W / 2, y + 4, FONT_FOOTER, C.muted, "top", "center");
    }
    y += s.h;
  }

  return new Promise((res, rej) => {
    canvas.toBlob(b => b ? res(b) : rej(new Error("canvas.toBlob 失敗")), "image/png");
  });
}

// ============================================================
// Modal
// ============================================================
function showModal(title, bodyHtml, actions) {
  document.getElementById("modal-title").textContent = title;
  document.getElementById("modal-body").innerHTML = bodyHtml;
  const ac = document.getElementById("modal-actions");
  ac.innerHTML = "";
  actions.forEach(a => {
    const b = document.createElement("button");
    b.textContent = a.label;
    if (a.primary) b.className = "primary";
    b.onclick = a.action;
    ac.appendChild(b);
  });
  document.getElementById("modal-bg").classList.add("open");
}
function closeModal() { document.getElementById("modal-bg").classList.remove("open"); }

// ============================================================
// 啟動
// ============================================================
render();
