<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>Beyblade X 收藏管理</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BeyX 收藏">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel2: #1f232c;
    --border: #2a2f3a;
    --text: #e6e9ef;
    --muted: #8a93a3;
    --accent: #4ea1ff;
    --accent2: #7cf;
    --owned: #2ecc71;
    --missing: #ff6b6b;
    --warn: #f5a623;
  }
  [data-theme="light"] {
    --bg: #f0f2f5;
    --panel: #ffffff;
    --panel2: #e8ecf0;
    --border: #d0d5dd;
    --text: #1a1a2e;
    --muted: #5a6370;
    --accent: #2563eb;
    --accent2: #1e4db7;
    --owned: #16a34a;
    --missing: #dc2626;
    --warn: #d97706;
  }
  [data-theme="light"] .tier-T0   { background: #fee2e2; color: #991b1b; }
  [data-theme="light"] .tier-T0-5 { background: #fce7f3; color: #831843; }
  [data-theme="light"] .tier-T1   { background: #fef3c7; color: #92400e; }
  [data-theme="light"] .tier-T1-5 { background: #ecfccb; color: #3f6212; }
  [data-theme="light"] .tier-T2   { background: #dcfce7; color: #166534; }
  [data-theme="light"] .tier-T3   { background: #dbeafe; color: #1e40af; }
  [data-theme="light"] .tier-T4   { background: #e9e5f5; color: #4338ca; }
  [data-theme="light"] .tier-T5   { background: #e8ecf0; color: #5a6370; }
  [data-theme="light"] .pill.att { background: #fee2e2; color: #991b1b; }
  [data-theme="light"] .pill.def { background: #dbeafe; color: #1e40af; }
  [data-theme="light"] .pill.sta { background: #dcfce7; color: #166534; }
  [data-theme="light"] .pill.bal { background: #fef3c7; color: #92400e; }
  [data-theme="light"] .tier-pill { background: #e2e6ec; color: #1a1a2e; border-color: #c0c6d0; }
  [data-theme="light"] .tier-pill.owned { background: rgba(22,163,74,0.15); color: #15803d; border-color: #16a34a; }
  [data-theme="light"] .tier-pill.missing { opacity: 0.45; }
  [data-theme="light"] .tier-pill[onclick]:hover { background: #d0d6e0; }
  [data-theme="light"] button:hover { background: #d8dde5; }
  [data-theme="light"] button.primary:hover { background: #3b82f6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg); color: var(--text);
    font-size: 14px; line-height: 1.45;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--panel);
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header .stats { color: var(--muted); font-size: 12px; }
  header .stats b { color: var(--text); font-weight: 600; }
  header .actions { margin-left: auto; display: flex; gap: 6px; align-items: stretch; }
  header .actions > button,
  header .actions .more-wrap > button {
    display: inline-flex; align-items: center; justify-content: center;
    height: 32px; line-height: 1; padding: 0 12px;
  }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  /* 防止 iOS Safari 在點擊 input 時自動放大畫面 */
  input, textarea, select { font-size: 16px; outline: none; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  button:hover { background: #2a3040; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #001833; }
  button.primary:hover { background: #6cb3ff; }
  button.danger { color: var(--missing); }
  #sync-btn.syncing #sync-btn-label::after { content: "…"; }
  #sync-btn.synced { color: var(--owned); }
  #sync-btn.error { color: var(--missing); }
  #sync-btn.signed-out { color: var(--muted); }
  .more-wrap { position: relative; display: inline-block; }
  .more-menu {
    position: absolute; top: calc(100% + 4px); right: 0;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; min-width: 170px; padding: 4px 0;
    box-shadow: 0 6px 16px rgba(0,0,0,0.5);
    z-index: 60; display: none;
  }
  .more-menu.open { display: block; }
  .more-menu button {
    display: block; width: 100%; text-align: left;
    border: none; border-radius: 0; padding: 8px 14px;
    background: transparent; font-size: 13px;
  }
  .more-menu button:hover { background: var(--panel2); }
  .more-menu hr {
    border: none; border-top: 1px solid var(--border);
    margin: 4px 0;
  }
  .sync-row { display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .sync-row:last-child { border-bottom:none; }
  .sync-row span:first-child { color: var(--muted); }

  .layout { display: grid; grid-template-columns: 380px 1fr; height: calc(100vh - 49px); }
  .sidebar { border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--panel); }
  .main { overflow: auto; padding: 16px 20px calc(32px + env(safe-area-inset-bottom)); }

  .tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tab {
    flex: 1; padding: 10px; text-align: center; cursor: pointer;
    color: var(--muted); border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }

  .toolbar { padding: 10px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10; background: var(--panel);
  }
  .toolbar input[type="search"] {
    width: 100%; padding: 7px 10px; background: var(--bg);
    border: 1px solid var(--border); color: var(--text); border-radius: 6px;
  }
  .filters { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
  .filter-row { display: flex; gap: 6px; align-items: center; }
  .filter-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 6px 14px; border-radius: 18px; cursor: pointer;
    border: 1.5px solid var(--border); background: transparent;
    font-size: 14px; color: var(--muted); transition: all 0.15s;
    user-select: none; -webkit-user-select: none;
  }
  .filter-chip:not(.active) { opacity: 0.5; }
  .filter-chip.active { color: var(--text); border-color: var(--accent); background: rgba(37,99,235,0.12); }
  .filter-chip.active[data-f="owned"] { border-color: var(--owned); background: rgba(22,163,74,0.12); color: var(--owned); }
  .filter-chip.active[data-f="missing"] { border-color: var(--missing); background: rgba(220,38,38,0.12); color: var(--missing); }
  .filter-chip.active[data-f="wishlist"] { border-color: var(--warn); background: rgba(217,119,6,0.12); color: var(--warn); }
  .series-chip {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 5px 12px; border-radius: 18px; cursor: pointer;
    border: 1.5px solid var(--border); background: transparent;
    font-size: 13px; color: var(--muted); transition: all 0.15s;
    user-select: none; -webkit-user-select: none;
  }
  .series-chip img { width: 22px; height: 22px; }
  .series-chip.active { color: var(--text); }
  .series-chip.active[data-s="BX"] { border-color: #71bce9; background: rgba(113,188,233,0.12); }
  .series-chip.active[data-s="CX"] { border-color: #f42597; background: rgba(244,37,151,0.12); }
  .series-chip.active[data-s="UX"] { border-color: #ee7800; background: rgba(238,120,0,0.12); }
  .series-chip:not(.active) { opacity: 0.4; }

  .view-toggle {
    display: inline-flex; align-items: center; gap: 0;
    margin-left: auto; flex-shrink: 0;
    border: 1.5px solid var(--border); border-radius: 8px; overflow: hidden;
  }
  .view-toggle button {
    padding: 5px 12px; font-size: 12px; border: none; border-radius: 0;
    background: transparent; color: var(--muted);
    cursor: pointer; line-height: 1.4;
  }
  .view-toggle button + button { border-left: 1.5px solid var(--border); }
  .view-toggle button.active { background: var(--accent); color: #fff; }

  .product-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px; padding: 8px 10px;
  }
  .product-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; cursor: pointer; transition: all 0.2s;
    display: flex; flex-direction: column; gap: 6px;
  }
  .product-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .product-card.owned { border-color: rgba(46,204,113,0.4); }
  .product-card .pc-header {
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .product-card .pc-code { font-weight: 700; font-size: 14px; }
  .product-card .pc-badge {
    padding: 1px 7px; border-radius: 8px; font-size: 10px; font-weight: 600;
  }
  .product-card .pc-badge.done { background: var(--owned); color: #002b14; }
  .product-card .pc-badge.partial { background: var(--warn); color: #1a1a2e; }
  .product-card .pc-type { color: var(--muted); font-size: 11px; }
  .product-card .pc-name { font-size: 12px; color: var(--accent2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .product-card .pc-tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .product-card .pc-coat {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 10px; color: var(--muted); padding: 1px 6px;
    background: var(--panel2); border-radius: 8px;
  }
  .product-card .pc-coat-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .product-card .pc-img {
    width: 100%; aspect-ratio: 1; object-fit: contain;
  }
  .product-card .pc-noimg {
    width: 100%; aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    background: var(--panel2); border-radius: 8px;
    color: var(--muted); font-size: 12px;
  }
  .product-card .pc-foot {
    display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--muted);
  }
  .product-card .pc-bar {
    flex: 1; height: 4px; background: var(--bg); border-radius: 2px; overflow: hidden;
  }
  .product-card .pc-bar-fill {
    height: 100%; background: var(--owned); border-radius: 2px; transition: width 0.3s;
  }

  .list { flex: 1; overflow: auto; padding: 4px 0; padding-bottom: calc(32px + env(safe-area-inset-bottom)); }
  .group {
    border-top: 1px solid var(--border);
  }
  .group:first-child { border-top: none; }
  .group-head {
    padding: 8px 12px; font-size: 12px; font-weight: 600;
    background: var(--panel2); color: var(--accent2);
    position: sticky; top: 0; z-index: 1;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer;
  }
  .group-head .count { color: var(--muted); font-weight: normal; font-size: 11px; }
  .group-body { display: block; }
  .group.collapsed .group-body { display: none; }
  .item {
    padding: 6px 12px 6px 24px; cursor: pointer;
    display: flex; align-items: center; gap: 8px; font-size: 13px;
    border-left: 3px solid transparent;
  }
  .item:hover { background: rgba(255,255,255,0.03); }
  .item.selected { background: rgba(78,161,255,0.12); border-left-color: var(--accent); }
  .item.owned { color: var(--text); }
  .item.owned .name { color: var(--owned); }
  .item .qty {
    margin-left: auto; font-size: 11px; color: var(--muted);
    background: var(--panel2); padding: 1px 6px; border-radius: 10px;
  }
  .item.owned .qty { background: rgba(46,204,113,0.15); color: var(--owned); }
  .item .check { font-family: monospace; color: var(--muted); padding: 0 4px; border-radius: 50%; }
  .item.owned .check { color: var(--owned); }
  .item .check.toggleable { cursor: pointer; }
  .item .check.toggleable:hover { background: rgba(78,161,255,0.2); color: var(--accent); }
  .item.owned .check.toggleable:hover { background: rgba(46,204,113,0.25); }
  .item-thumb {
    width: 28px; height: 28px; object-fit: contain;
    background: var(--panel2); border-radius: 4px; flex-shrink: 0;
  }

  .detail h2 { margin: 0 0 4px; font-size: 18px; }
  .detail .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px; margin-bottom: 12px;
  }
  .card h3 { margin: 0 0 8px; font-size: 14px; color: var(--accent2); font-weight: 600; }
  .card .row { display: flex; gap: 10px; align-items: baseline; padding: 3px 0; }
  .card .row .k { color: var(--muted); width: 80px; flex-shrink: 0; font-size: 12px; }
  .card .row .v { color: var(--text); }
  .desc { color: var(--muted); font-size: 12px; margin-top: 4px; line-height: 1.5; }

  .bit-img-wrap {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 12px; padding: 12px; display: flex; justify-content: center;
  }
  .bit-img { max-height: 220px; width: auto; object-fit: contain; }

  .cx-piece {
    margin: 0; display: flex; flex-direction: column; align-items: center;
    background: rgba(255,255,255,0.04); border-radius: 6px; padding: 6px;
    min-width: 90px;
  }
  .cx-piece img { max-height: 120px; width: auto; object-fit: contain; }
  .cx-piece figcaption {
    font-size: 11px; color: var(--text); margin-top: 4px; text-align: center;
  }
  .cx-piece .cx-cat {
    display: block; color: var(--muted); font-size: 10px;
    font-family: monospace; text-transform: lowercase;
  }

  .prod-img-wrap {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 12px; padding: 12px; display: flex; justify-content: center;
  }
  .prod-img { max-height: 280px; width: auto; object-fit: contain; }

  .news-date-section { margin-bottom: 18px; }
  .news-date-head {
    margin: 4px 0 10px; font-size: 14px; color: var(--accent);
    border-bottom: 1px solid var(--border); padding-bottom: 4px;
  }
  .news-card { border-color: rgba(78,161,255,0.25); }
  .news-head {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 4px;
  }
  .news-code {
    font-family: monospace; font-size: 12px; color: var(--muted);
    padding: 1px 6px; border: 1px solid var(--border); border-radius: 4px;
  }
  .news-title { margin: 2px 0 6px; font-size: 15px; color: var(--text); }
  .news-imgs {
    display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0;
  }
  .news-imgs img {
    max-height: 180px; max-width: 100%;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px; object-fit: contain;
  }
  .news-desc { margin: 6px 0 0; padding-left: 18px; font-size: 13px; line-height: 1.6; }
  .news-desc li { margin-bottom: 2px; color: var(--text); }

  .exps-tabs {
    display: flex; gap: 6px; margin-bottom: 12px;
    border-bottom: 1px solid var(--border); padding-bottom: 8px;
  }

  .variants {
    display: grid; gap: 6px;
  }
  .variant {
    border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .variant.owned { border-color: var(--owned); background: rgba(46,204,113,0.05); }
  .variant .v-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .variant .vbey { font-weight: 600; font-size: 15px; line-height: 1.3; }
  .variant .vparts { color: var(--muted); font-size: 12px; }
  .variant .v-actions {
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    justify-content: flex-end;
  }
  .variant .v-actions button {
    width: 40px; height: 40px; font-size: 18px;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0; box-sizing: border-box;
  }
  .variant .v-actions .btn-wish {
    background: none; border: none; cursor: pointer; font-size: 20px;
  }
  .variant .vqty { width: 56px; height: 40px; text-align: center;
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text); padding: 0 4px; border-radius: 4px; font-size: 16px;
    box-sizing: border-box;
  }
  .variant .badge {
    background: var(--panel2); color: var(--muted); padding: 2px 6px; border-radius: 4px;
    font-size: 11px; flex-shrink: 0;
  }
  .variant.owned .badge { background: var(--owned); color: #002b14; }

  .pill {
    display: inline-block; padding: 1px 7px; margin-right: 4px;
    border-radius: 10px; font-size: 11px;
    background: var(--panel2); color: var(--muted);
  }
  .pill.att { background: #6b1f2a; color: #ffb8c1; }
  .pill.def { background: #1c4564; color: #b8d8ff; }
  .pill.sta { background: #1a4f30; color: #b8ffd1; }
  .pill.bal { background: #5a4711; color: #ffe5a1; }
  .pill.owned { background: var(--owned); color: #002b14; }
  .pill.missing { background: var(--missing); color: #1a0000; }

  .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider {
    position: absolute; inset: 0; background: var(--panel2); border-radius: 11px;
    cursor: pointer; transition: background 0.2s;
  }
  .switch .slider::before {
    content: ""; position: absolute; left: 2px; top: 2px;
    width: 18px; height: 18px; background: #fff; border-radius: 50%;
    transition: transform 0.2s;
  }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(18px); }

  .empty { color: var(--muted); padding: 30px; text-align: center; }

  .tier-row {
    display: grid; grid-template-columns: 60px 1fr; gap: 12px;
    align-items: start; padding: 8px 0;
    border-top: 1px solid var(--border);
  }
  .tier-row:first-of-type { border-top: none; }
  .tier-label {
    font-weight: 700; font-size: 13px; padding: 4px 8px;
    border-radius: 4px; background: var(--panel2); color: var(--muted);
    text-align: center; min-width: 44px;
  }
  .tier-T0    { background: #6b1f2a; color: #ffd0d8; }
  .tier-T0-5  { background: #5a2a44; color: #ffceec; }
  .tier-T1    { background: #5a4711; color: #ffe5a1; }
  .tier-T1-5  { background: #424a14; color: #e9f0a8; }
  .tier-T2    { background: #1a4f30; color: #b8ffd1; }
  .tier-T3    { background: #1c4564; color: #b8d8ff; }
  .tier-T4    { background: #34324a; color: #c2c0e0; }
  .tier-T5    { background: #2a2f3a; color: #8a93a3; }
  .tier-pills { display: flex; flex-wrap: wrap; gap: 4px; }
  .tier-pill {
    padding: 3px 8px; border-radius: 12px; font-size: 12px;
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border);
    cursor: default;
  }
  .tier-pill.owned { background: rgba(46,204,113,0.15); color: var(--owned); border-color: var(--owned); }
  .tier-pill.missing { opacity: 0.4; }
  .tier-pill[onclick] { cursor: pointer; }
  .tier-pill[onclick]:hover { background: #2a3040; }

  .source-list { display: flex; flex-wrap: wrap; gap: 4px; }
  .source-list .src {
    padding: 2px 8px; border-radius: 4px; background: var(--panel2);
    font-size: 11px; cursor: pointer; border: 1px solid var(--border);
  }
  .source-list .src.owned { background: rgba(46,204,113,0.18); border-color: var(--owned); color: var(--owned); }
  .source-list .src:hover { background: #2a3040; }

  .mine-sec-head {
    margin: 32px 0 12px; font-size: 16px; font-weight: 600;
    padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }
  .mine-sec-head:first-child { margin-top: 0; }
  .mine-part-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px;
    margin-bottom: 8px;
  }
  .mine-part-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px; cursor: pointer; transition: all 0.2s;
    display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
  }
  .mine-part-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .mine-part-img { width: 48px; height: 48px; object-fit: contain; flex-shrink: 0; border-radius: 6px; background: var(--panel2); }

</style>

<body>
<header>
  <h1>Beyblade X 收藏管理 <span style="color:var(--muted); font-size:11px; font-weight:normal; margin-left:4px;" title="建置日期 __BUILD_DATE__">__VERSION__</span></h1>
  <div class="stats" id="stats">載入中…</div>
  <div class="actions">
    <button id="sync-btn" onclick="openSyncDialog()" title="同步到 Google Drive"><svg viewBox="0 0 48 48" width="14" height="14" style="vertical-align:-2px; margin-right:2px;" aria-hidden="true"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg><span id="sync-btn-label">同步</span></button>
    <button onclick="switchTab('news')" style="position:relative;">📰 情報<span id="news-dot" style="display:none; position:absolute; top:4px; right:4px; width:8px; height:8px; background:#ef4444; border-radius:50%;"></span></button>

<div class="layout">

<script>
/*__DATA__*/

// ============================================================
// 資料整理
// ============================================================
const STORAGE_KEY = "beyx_collection_v1";

// 把 prod-beys 整理成更易用的結構
// 每筆變體有唯一 id: "<productId>#<index>"
const VARIANTS = [];
const PRODUCTS = {}; // productId -> { id, type, variants: [variant], hasCoat }

DB.beys.forEach((row, idx) => {
  // row: [productId, type, "blade ratchet bit", youtube?, options?]
  const [productId, type, parts, ...rest] = row;
  let youtube = null, opts = {};
  rest.forEach(r => {
    if (typeof r === "string") youtube = r;
    else if (r && typeof r === "object") opts = r;
  });
  const tokens = parts.split(/\s+/);
  let blade, ratchet, bit;
  if (tokens.length === 3) {
    [blade, ratchet, bit] = tokens;
  } else {
    // CX format eg "Bh.Bl.B.K 1-50 I" or 3 tokens always — but "Dr.Ar.S 2-70 K" splits into 3
    blade = tokens.slice(0, tokens.length - 2).join(" ");
    ratchet = tokens[tokens.length - 2];
    bit = tokens[tokens.length - 1];
  }
  const v = {
    id: productId + "#" + idx,
    productId, type, blade, ratchet, bit,
    youtube, opts, raw: parts,
  };
  VARIANTS.push(v);
  if (!PRODUCTS[productId]) PRODUCTS[productId] = { id: productId, type, variants: [] };
  PRODUCTS[productId].variants.push(v);
});

const PRODUCT_LIST = Object.values(PRODUCTS).sort((a, b) => productSort(a.id).localeCompare(productSort(b.id)));

function productSort(id) {
  // BX-35 -> "BX-035", BXG-21 -> "BXG-021", CX-7 -> "CX-007"
  return id.replace(/(\d+)/g, n => n.padStart(4, "0"));
}

function productSeries(id) {
  const m = id.match(/^([A-Z]+)/);
  if (!m) return "其他";
  const s = m[1];
  if (s === "BXA" || s === "BXC" || s === "BXG" || s === "BXH") return "BX";
  return s;
}

// 零件查找
// CX 戰刃片段在 chip / main / over / metal / assist / hasbro 等分類下查詢
// 位置 → 分類偏好 (4-part: chip.metal-or-main.over.assist; 3-part: chip.main.assist)
const CX_POSITIONS = {
  3: ["chip", "main", "assist"],
  4: ["chip", ["metal", "main"], "over", "assist"],
};
function findCxSegmentAt(seg, pos, total) {
  if (!seg || seg === "/") return null;
  const cx = (DB.bladeDivided && DB.bladeDivided.CX) || {};
  const positional = CX_POSITIONS[total];
  const fallback = ["chip", "metal", "main", "over", "assist", "hasbro"];
  const cats = positional && positional[pos]
    ? (Array.isArray(positional[pos]) ? positional[pos] : [positional[pos]])
    : fallback;
  for (const cat of cats) {
    if (cx[cat] && cx[cat][seg]) return { ...cx[cat][seg], _category: cat, _code: seg };
  }
  return null;
}
// 組合中文: 有 chi 翻譯的段直接接起來 (e.g. Bh.Bl.B.K → 龍王閃擊)
// 沒 chi 的段 (e.g. CX assist W/M) 用代號補上, 讓 Cr.Fl.W 跟 Wh.Fl.M 可區分
// 中文段之間直接相連; 中英混雜處用「·」分隔避免讀成一串
function cxComposeChi(code) {
  const segs = code.split(".").map(s => s.trim());
  let out = "";
  let lastIsChi = false;
  let any = false;
  segs.forEach((s, i) => {
    if (!s || s === "/") return;
    const f = findCxSegmentAt(s, i, segs.length);
    const chi = f ? preferredChi(f.names && f.names.chi) : "";
    const token = chi || s;
    const isChi = !!chi;
    if (out && !(lastIsChi && isChi)) out += "·";
    out += token;
    lastIsChi = isChi;
    any = true;
  });
  return any ? out : code;
}
function bladeInfo(code) {
  if (code.includes(".") || code.includes("/")) {
    const chi = cxComposeChi(code);
    return { code, names: { chi: chi }, desc: "(CX 組合刃)", isCx: true };
  }
  return DB.blade[code] || (DB.bladeCollab && DB.bladeCollab[code]) || { code, names: { chi: "(未知)" } };
}
function ratchetInfo(code) { return DB.ratchet[code] || { desc: "(未知)" }; }
function bitInfo(code) { return DB.bit[code] || { names: { chi: "(未知)" } }; }

function bitImageSrc(code) {
  return `bits/${encodeURIComponent(code)}.png`;
}
function ratchetImageSrc(code) {
  return `ratchets/${encodeURIComponent(code)}.png`;
}

// 戰刃圖片來源
// 單體戰刃: blades/{abbr}.png
// CX 組合刃: 拆段 → 各段 blades/CX/{cat}/{abbr}.png (cat 由位置決定)
function bladeImageSrc(code) {
  if (!code || code.includes("/") || code.includes(".")) return null;
  return `blades/${encodeURIComponent(code)}.png`;
}
function cxBladeSegments(code) {
  if (!code || !code.includes(".")) return [];
  const segs = code.split(".").map(s => s.trim());
  return segs.map((s, i) => {
    if (!s || s === "/") return null;
    const f = findCxSegmentAt(s, i, segs.length);
    if (!f) return null;
    return { abbr: s, cat: f._category, src: `blades/CX/${f._category}/${encodeURIComponent(s)}.png`, names: f.names };
  });
}

// 商品圖片來源: 本地預處理的透明 PNG (rembg + isnet-general-use 從 Takara Tomy 官圖去背)
// 只涵蓋 BX/BXG/CX/UX; BXH/BXA/BXC 沒對應圖會 onerror 隱藏
function productImageSrc(pid) {
  return `products/${pid.replace(/-/g, "")}@1.png`;
}

// 來源資料用 "/" 表示「該位置沒有零件」(例如單售零件包)
// CX 還會用 "/./.X" 形式; 固鎖也用 "=" 表示「沒有固鎖」(例如 "Em.Mg.H = Op")
// 拆掉這些占位符後沒剩任何字元就是空
function isEmptyPart(code) {
  return !code || !code.replace(/[\/\.=]/g, "").length;
}

// 商品種類代號 → 中文。第二段 H 表示異色版／再推出。
const PRODUCT_TYPE_NAMES = {
  "S":  "起始包",
  "B":  "補充包",
  "St": "套組",
  "SS": "對戰盤套組",
  "RB": "隨機補充包",
  "Lm": "限定",
};
const COAT_NAMES = {
  black: "黑", blue: "藍", blueviolet: "藍紫", coral: "珊瑚",
  crimson: "紅", darkorange: "橘", deepskyblue: "天藍", dodgerblue: "藍",
  gold: "金", lightseagreen: "青綠", limegreen: "萊姆綠", mediumorchid: "紫",
  mediumvioletred: "桃紅", royalblue: "寶藍", sienna: "棕", white: "白", yellow: "黃",
};
function coatName(c) { return COAT_NAMES[c] || c; }

function productTypeName(code) {
  if (!code) return "";
  const parts = code.split(/\s+/);
  const main = PRODUCT_TYPE_NAMES[parts[0]] || parts[0];
  const isHasbro = parts.includes("H");
  return isHasbro ? main + "・異色版" : main;
}

// chi 欄位格式為「港譯 台譯」(以空白分隔)，取最後一段=台譯
// 名字內的 "\" 是 chip\main 結構分隔符，顯示時拿掉 (e.g. "空力\天馬" → "空力天馬")
function preferredChi(c) {
  if (!c) return "";
  const tokens = c.split(/\s+/).filter(Boolean);
  return (tokens[tokens.length - 1] || "").replace(/\\/g, "");
}
function bladeName(code) {
  const b = bladeInfo(code);
  if (b.isCx) return (b.names && b.names.chi) || code;
  return preferredChi(b.names && b.names.chi) || code;
}
function bitName(code) {
  const b = bitInfo(code);
  return preferredChi(b.names && b.names.chi) || code;
}

// 由所有資料統計可獲得的零件 (排除 "/" 等占位符)
const ALL_BLADES = new Set();
const ALL_RATCHETS = new Set();
const ALL_BITS = new Set();
VARIANTS.forEach(v => {
  if (!isEmptyPart(v.blade))   ALL_BLADES.add(v.blade);
  if (!isEmptyPart(v.ratchet)) ALL_RATCHETS.add(v.ratchet);
  if (!isEmptyPart(v.bit))     ALL_BITS.add(v.bit);
});

// 從零件 → 變體列表
const PART_SOURCES = { blade: {}, ratchet: {}, bit: {} };
VARIANTS.forEach(v => {
  if (!isEmptyPart(v.blade))   (PART_SOURCES.blade[v.blade]     = PART_SOURCES.blade[v.blade]     || []).push(v);
  if (!isEmptyPart(v.ratchet)) (PART_SOURCES.ratchet[v.ratchet] = PART_SOURCES.ratchet[v.ratchet] || []).push(v);
  if (!isEmptyPart(v.bit))     (PART_SOURCES.bit[v.bit]         = PART_SOURCES.bit[v.bit]         || []).push(v);
});

// ============================================================
// 收藏狀態
// ============================================================
let state = loadState();

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if (s && s.owned) {
      if (!Array.isArray(s.builds)) s.builds = [];
      if (typeof s.updatedAt !== "number") s.updatedAt = 0;
      if (!s.prefs || typeof s.prefs !== "object") s.prefs = {};
      if (!s.wishlist || typeof s.wishlist !== "object") s.wishlist = {};
      return s;
    }
  } catch (e) {}
  return { owned: {}, builds: [], updatedAt: 0, prefs: {}, wishlist: {} };
}
// 是否正在從 Drive 套用遠端資料 (套用過程不應該再回推)
let _applyingRemote = false;
function saveState() {
  if (!_applyingRemote) state.updatedAt = Date.now();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  if (!_applyingRemote && typeof scheduleSyncPush === "function") scheduleSyncPush();
}
function setOwned(vid, qty) {
  qty = Math.max(0, parseInt(qty) || 0);
  if (qty <= 0) delete state.owned[vid];
  else state.owned[vid] = qty;
  saveState();
  if (!_patchVariantRow(vid)) render();
  renderStats(); renderList();
}
function isOwned(vid) { return (state.owned[vid] || 0) > 0; }
function ownedQty(vid) { return state.owned[vid] || 0; }
function isWishlisted(vid) { return !!state.wishlist[vid]; }
function toggleWishlist(vid) {
  if (state.wishlist[vid]) delete state.wishlist[vid];
  else state.wishlist[vid] = 1;
  saveState();
  if (!_patchVariantRow(vid)) render();
  renderStats(); renderList();
}
// Patch a single variant row in-place (no full re-render → no scroll jump)
function _patchVariantRow(vid) {
  const row = document.querySelector(`.variant[data-vid="${vid}"]`);
  if (!row) return false;
  const qty = ownedQty(vid);
  const owned = qty > 0;
  const wished = isWishlisted(vid);
  // Update class
  row.classList.toggle("owned", owned);
  // Update badge
  const badge = row.querySelector(".badge");
  if (badge) badge.textContent = owned ? "✓ 擁有" : "—";
  // Update actions
  const actions = row.querySelector(".v-actions");
  if (actions) {
    const wish = actions.querySelector(".btn-wish");
    if (wish) { wish.textContent = wished ? "★" : "☆"; wish.style.color = wished ? "var(--warn)" : "var(--muted)"; }
    const btns = actions.querySelectorAll("button:not(.btn-wish)");
    if (btns[0]) { btns[0].disabled = qty <= 0; btns[0].setAttribute("onclick", `setOwned('${vid}', ${qty - 1})`); }
    if (btns[1]) { btns[1].setAttribute("onclick", `setOwned('${vid}', ${qty + 1})`); }
    const input = actions.querySelector(".vqty");
    if (input) input.value = qty;
  }
  // Update header owned count + batch buttons
  if (selected && selected.type === "product") {
    const p = PRODUCTS[selected.id];
    if (p) {
      const ownedV = p.variants.filter(v => isOwned(v.id)).length;
      const sub = document.querySelector(".detail .sub");
      if (sub) sub.textContent = `擁有 ${ownedV}/${p.variants.length} 陀螺`;
      const bb = document.getElementById("batch-btns");
      if (bb) {
        bb.innerHTML =
          (ownedV < p.variants.length ? `<button onclick="batchOwn('${p.id}', true)">✓ 全部擁有</button>` : "") +
          (ownedV > 0 ? `<button class="danger" onclick="batchOwn('${p.id}', false)">✗ 全部取消</button>` : "");
      }
    }
  }
  return true;
}
function toggleTheme() {
  const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = next;
  state.prefs.theme = next;
  saveState();
  updateThemeBtn();
  document.querySelector('meta[name="theme-color"]').content = next === "light" ? "#ffffff" : "#0f1115";
}
function updateThemeBtn() {
  const btn = document.getElementById("theme-btn");
  if (btn) btn.textContent = document.documentElement.dataset.theme === "light" ? "🌙 深色模式" : "☀️ 淺色模式";
}

// 配置 (builds) 操作
function newBuildId() { return "b" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function getBuild(id) { return state.builds.find(b => b.id === id); }
function newBuild() {
  const b = { id: newBuildId(), name: "新配置 " + (state.builds.length + 1), blade: "", ratchet: "", bit: "", note: "", cx: false, chip: "", main: "", over: "", assist: "" };
  state.builds.push(b);
  saveState();
  selected = { type: "build", id: b.id };
  render();
}
function updateBuildField(id, field, value) {
  const b = getBuild(id);
  if (!b) return;
  b[field] = value;
  saveState();
  renderList(); renderStats();  // 刷側欄與頂統計，但不刷 detail (避免輸入失焦)
}
function deleteBuild(id) {
  if (!confirm("刪除這個配置？")) return;
  state.builds = state.builds.filter(b => b.id !== id);
  saveState(); selected = null; render();
}
function duplicateBuild(id) {
  const orig = getBuild(id); if (!orig) return;
  const copy = { ...orig, id: newBuildId(), name: orig.name + " 複本" };
  state.builds.push(copy); saveState();
  selected = { type: "build", id: copy.id }; render();
}
// 把變體顯示成「中文戰刃 固鎖 中文軸」(用於來源 pill 顯示)
function variantDisplayChi(v) {
  const b = isEmptyPart(v.blade) ? "—" : (bladeName(v.blade) || v.blade);
  const r = isEmptyPart(v.ratchet) ? "—" : v.ratchet;
  const i = isEmptyPart(v.bit) ? "—" : (bitName(v.bit) || v.bit);
  return `${b} ${r} ${i}`;
}

function buildStatus(b) {
  const op = ownedParts();
  if (b.cx) {
    // CX: check each segment individually + ratchet + bit
    const cxSegs = ownedCxSegments();
    const slots = [
      { code: b.chip, set: cxSegs.chip },
      { code: b.main, set: new Set([...cxSegs.main, ...cxSegs.metal]) },
      { code: b.over, set: cxSegs.over },
      { code: b.assist, set: cxSegs.assist },
    ];
    let need = 0, have = 0;
    slots.forEach(s => { if (s.code) { need++; if (s.set.has(s.code)) have++; } });
    if (b.ratchet) { need++; if (op.ratchets.has(b.ratchet)) have++; }
    if (b.bit) { need++; if (op.bits.has(b.bit)) have++; }
    return { need, have, complete: need > 0 && have === need, missing: need - have };
  }
  const need = [b.blade, b.ratchet, b.bit].filter(Boolean).length;
  const have = (b.blade && op.blades.has(b.blade) ? 1 : 0) +
               (b.ratchet && op.ratchets.has(b.ratchet) ? 1 : 0) +
               (b.bit && op.bits.has(b.bit) ? 1 : 0);
  return { need, have, complete: need === 3 && have === 3, missing: need - have };
}

function ownedCxSegments() {
  const segs = { chip: new Set(), metal: new Set(), main: new Set(), over: new Set(), assist: new Set() };
  Object.keys(state.owned).forEach(vid => {
    const v = VARIANTS.find(x => x.id === vid);
    if (!v || isEmptyPart(v.blade) || !v.blade.includes(".")) return;
    const parts = v.blade.split(".");
    parts.forEach((s, i) => {
      if (!s || s === "/") return;
      const f = findCxSegmentAt(s, i, parts.length);
      if (f) segs[f._category].add(s);
    });
  });
  return segs;
}
function ownedParts() {
  const blades = new Set(), ratchets = new Set(), bits = new Set();
  Object.keys(state.owned).forEach(vid => {
    const v = VARIANTS.find(x => x.id === vid);
    if (!v) return;
    if (!isEmptyPart(v.blade))   blades.add(v.blade);
    if (!isEmptyPart(v.ratchet)) ratchets.add(v.ratchet);
    if (!isEmptyPart(v.bit))     bits.add(v.bit);
  });
  return { blades, ratchets, bits };
}

const NEWS_TTL_MS = 30 * 60 * 1000; // 30 分鐘
let newsState = { status: "idle", data: null, error: null, fetchedAt: 0 };
function loadNewsCache() {
  try {
    const c = JSON.parse(localStorage.getItem(NEWS_CACHE_KEY) || "null");
    if (c && c.data && c.data.products && c.fetchedAt) { newsState = { status: "ok", data: c.data, error: null, fetchedAt: c.fetchedAt }; }
  } catch (e) {}
  // 清除舊格式快取
  localStorage.removeItem("beyx-news-cache");
}
async function fetchNews(force = false) {
  if (!force && newsState.status === "ok" && Date.now() - newsState.fetchedAt < NEWS_TTL_MS) return;
  newsState.status = "loading";
  if (activeTab === "news") render();
  try {
    const resp = await fetch(NEWS_URL, { cache: "no-cache" });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const data = await resp.json();
    newsState = { status: "ok", data, error: null, fetchedAt: Date.now() };
    localStorage.setItem(NEWS_CACHE_KEY, JSON.stringify({ data, fetchedAt: newsState.fetchedAt }));
  } catch (e) {
    newsState.status = newsState.data ? "ok" : "error";
    newsState.error = String(e);
  }
  updateNewsDot();
  if (activeTab === "news") render();
}

// 排行榜：blade 名稱比對的時候，把 (BX)/(CX)/(復刻) 等標記跟空白都先剝掉
function tierStripMarkers(s) {
  return s
    .replace(/\s*\([^)]*\)\s*/g, "")
    .replace(/\s*—.*$/, "")
    .replace(/^輔助戰\s+/, "")
    .trim();
}
// CX 組合名比對：bladeName 可能含多餘段 (e.g. "帝皇威能·H")，
// 排行榜只寫 chip+metal 名 (e.g. "帝皇威能")，所以也要比前綴
function tierCxNameMatch(composedName, cand) {
  if (composedName === cand) return true;
  // 前綴比對: "帝皇威能·H".startsWith("帝皇威能") 且下一字元是 "·" 或字串結尾
  if (composedName.startsWith(cand) && (composedName.length === cand.length || composedName[cand.length] === "·")) return true;
  return false;
}

// 把 chi 欄位的所有可能名字 (港譯/台譯/aka) 列出來，全部去掉 "\"
function bladeAllNames(code) {
  if (code.includes(".") || code.includes("/")) {
    const info = bladeInfo(code);
    const chi = info.names && info.names.chi;
    return chi ? [chi.replace(/\\/g, "")] : [];
  }
  const info = (DB.blade && DB.blade[code]) || (DB.bladeCollab && DB.bladeCollab[code]);
  if (!info || !info.names) return [];
  const out = new Set();
  ["chi", "aka"].forEach(f => {
    const v = info.names[f];
    if (!v) return;
    v.split(/\s+/).forEach(t => { if (t) out.add(t.replace(/\\/g, "")); });
  });
  return [...out];
}

// 找哪個 CX 段名 (chip/metal/main/over/assist/hasbro) 對到此名字。
// 也支援直接以代號比對 (e.g. "W" 對到 assist W，因 assist 沒中文名)。
function findCxSegmentByName(name) {
  const cx = (DB.bladeDivided && DB.bladeDivided.CX) || {};
  const cats = ["chip", "metal", "main", "over", "assist", "hasbro"];
  for (const cat of cats) {
    if (!cx[cat]) continue;
    for (const [code, info] of Object.entries(cx[cat])) {
      const chi = info.names && info.names.chi;
      if (!chi) continue;
      const tokens = chi.split(/\s+/).map(t => t.replace(/\\/g, ""));
      if (tokens.includes(name)) return { code, cat };
    }
  }
  for (const cat of cats) {
    if (cx[cat] && cx[cat][name]) return { code: name, cat };
  }
  return null;
}

// 排行榜戰刃名字 → 是否被任一已擁有戰刃涵蓋
// (單片名字相符；或 CX 組合名 / 段名跟某個擁有的 CX 戰刃對得上)
function tierIsBladeOwned(name, ownedBlades) {
  const stripped = tierStripMarkers(name);
  if (!stripped || !ownedBlades.size) return false;
  const candidates = stripped.split(/\s*\/\s*/).map(s => s.trim()).filter(Boolean);
  for (const cand of candidates) {
    let seg = null;
    for (const code of ownedBlades) {
      if (!code.includes(".") && !code.includes("/")) {
        if (bladeAllNames(code).includes(cand)) return true;
      } else {
        if (tierCxNameMatch(bladeName(code), cand)) return true;
        if (seg === null) seg = findCxSegmentByName(cand) || false;
        if (seg && code.split(".").includes(seg.code)) return true;
      }
    }
  }
  // 模糊比對 — 單片
  for (const cand of candidates) {
    for (const code of ownedBlades) {
      if (code.includes(".") || code.includes("/")) continue;
      if (bladeAllNames(code).some(n => n && (n.includes(cand) || cand.includes(n)))) return true;
    }
  }
  return false;
}

// 排行榜戰刃名字 → 跳轉目標。回傳 {kind:"blade",id} 或 {kind:"product",id} 或 null
function tierBladeMatch(name) {
  const stripped = tierStripMarkers(name);
  if (!stripped) return null;
  const candidates = stripped.split(/\s*\/\s*/).map(s => s.trim()).filter(Boolean);
  if (!candidates.length) return null;
  // 1. 完全相符的單片戰刃 (chi/aka 各 token)
  for (const cand of candidates) {
    for (const code of ALL_BLADES) {
      if (code.includes(".") || code.includes("/")) continue;
      if (bladeAllNames(code).includes(cand)) return { kind: "blade", id: code };
    }
  }
  // 2. 完全相符的 CX 組合戰刃 (跳到第一個含此組合的商品)
  for (const cand of candidates) {
    for (const v of VARIANTS) {
      if (isEmptyPart(v.blade)) continue;
      if (!v.blade.includes(".") && !v.blade.includes("/")) continue;
      if (tierCxNameMatch(bladeName(v.blade), cand)) return { kind: "product", id: v.productId };
    }
  }
  // 3. CX 段名 fallback (e.g. 狂怒→metal Rg, W→assist W) — 找一個含此段的商品
  for (const cand of candidates) {
    const seg = findCxSegmentByName(cand);
    if (!seg) continue;
    for (const v of VARIANTS) {
      if (isEmptyPart(v.blade) || !v.blade.includes(".")) continue;
      if (v.blade.split(".").includes(seg.code)) return { kind: "product", id: v.productId };
    }
  }
  // 4. 模糊比對 (子字串) — 單片戰刃
  for (const cand of candidates) {
    for (const code of ALL_BLADES) {
      if (code.includes(".") || code.includes("/")) continue;
      const names = bladeAllNames(code);
      if (names.some(n => n && (n.includes(cand) || cand.includes(n)))) return { kind: "blade", id: code };
    }
  }
  return null;
}

  const renderPartRow = (label, codes, ownedSet, kind) => {

        const ghost = showOwned && !owned;
        const cls = (showOwned && owned) ? "owned" : (ghost ? "missing" : "");
        return `<span class="tier-pill ${cls}" onclick="tierJumpToPart('${code.replace(/'/g, "\\'")}', '${kind}')" title="點此跳到零件">${code}</span>`;
      }).join("")}</div>
    </div>`;
  };

  const toggle = `<div style="display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;">
    <button class="${showOwned ? 'primary' : ''}" onclick="filterOpts.ownedOnly = !filterOpts.ownedOnly; render();">
      ${showOwned ? '✓ ' : ''}標示已擁有
    </button>
  </div>`;

  const bladeSection = `<h2 id="tier-blade" style="margin-top:0;">⚔️ 戰刃 排行榜</h2>` +
    tierOrder.map(t => tier.blade && tier.blade[t] ? renderBladeRow(t, tier.blade[t]) : "").join("");

  const ratchetSection = `<h2 id="tier-ratchet" style="margin-top:24px;">⚙️ 固鎖 排行榜</h2>` +
    tierOrder.map(t => tier.ratchet && tier.ratchet[t] ? renderPartRow(t, tier.ratchet[t], op.ratchets, "ratchet") : "").join("");

  const bitSection = `<h2 id="tier-bit" style="margin-top:24px;">🔩 軸 排行榜</h2>` +
    tierOrder.map(t => tier.bit && tier.bit[t] ? renderPartRow(t, tier.bit[t], op.bits, "bit") : "").join("");

  return `<div>${toggle}${bladeSection}${ratchetSection}${bitSection}</div>`;
}

function tierJumpToPart(code, kind) {
  if (!code) return;
  const set = kind === "bit" ? ALL_BITS : ALL_RATCHETS;
  if (!set.has(code)) return;
  switchTab("parts", "tier");
  select(kind, code);
}

function tierJumpToBlade(kind, id) {
  if (!id) return;
  if (kind === "blade") {
    if (!ALL_BLADES.has(id)) return;
    switchTab("parts", "tier");
    select("blade", id);
  } else if (kind === "product") {
    if (!PRODUCTS[id]) return;
    switchTab("products", "tier");
    select("product", id);
  }
}

function renderProductList(q) {
  const series = {};
  PRODUCT_LIST.forEach(p => {
    const s = productSeries(p.id);
    if (filterOpts.series[s] === false) return;
    if (!series[s]) series[s] = [];
    series[s].push(p);
  });
  const html = [];
  Object.keys(series).sort().forEach(s => {
    const items = series[s].filter(p => productMatches(p, q));
    if (!items.length) return;
    let visible = 0;
    const rows = items.map(p => {
      const ownedV = p.variants.filter(v => isOwned(v.id)).length;
      const total = p.variants.length;
      if (filterOpts.ownedOnly && ownedV === 0) return "";
      if (filterOpts.missingOnly && ownedV === total) return "";
      if (filterOpts.wishlistOnly && !p.variants.some(v => isWishlisted(v.id))) return "";
      visible++;
      const cls = (ownedV === total ? "owned" : "") + (selected && selected.type==="product" && selected.id===p.id ? " selected" : "");
      const blades = [...new Set(p.variants
        .map(v => isEmptyPart(v.blade) ? null : bladeName(v.blade))
        .filter(Boolean))];
      const bladesStr = blades.length === 0 ? ""
        : blades.length > 3 ? blades.slice(0, 2).join("、") + ` +${blades.length - 2}`
        : blades.join("、");
      const isSingle = p.variants.length === 1;
      const onlyV = isSingle ? p.variants[0] : null;
      const checkChar = ownedV === total ? "●" : ownedV > 0 ? "◐" : "○";
      const checkClick = isSingle
        ? `event.stopPropagation(); setOwned('${onlyV.id}', ${isOwned(onlyV.id) ? 0 : 1})`
        : "";
      const checkTitle = isSingle ? "點此快速切換擁有/未擁有" : "";
      const hasWish = p.variants.some(v => isWishlisted(v.id));
      return `<div class="item ${cls}" onclick="select('product','${p.id}')">
        <span class="check ${isSingle ? "toggleable" : ""}" ${checkClick ? `onclick="${checkClick}"` : ""} title="${checkTitle}">${checkChar}</span>
        <span class="name">${hasWish ? "★ " : ""}${p.id}</span>
        <span style="color:var(--muted); font-size:11px;" title="${p.type}">${productTypeName(p.type)}</span>
        <span style="font-size:11px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${blades.join("、")}">${bladesStr}</span>
        <span class="qty">${ownedV}/${total}</span>
      </div>`;
    }).join("");
    if (visible) {
      const gkey = "products:" + s;
      const collapsed = collapsedGroups.has(gkey);
      html.push(`<div class="group ${collapsed ? "collapsed" : ""}">
        <div class="group-head" onclick="toggleGroup('${gkey}')">
          <span>${s} 系列</span>
          <span class="count">${visible} / ${items.length}</span>
        </div>
        <div class="group-body">${rows}</div>
      </div>`);
    }
  });
  return html.join("") || `<div class="empty">沒有符合條件的商品</div>`;
}

function renderProductGrid(q) {
  const seriesMap = {};
  PRODUCT_LIST.forEach(p => {
    const s = productSeries(p.id);
    if (filterOpts.series[s] === false) return;
    if (!seriesMap[s]) seriesMap[s] = [];
    seriesMap[s].push(p);
  });
  const html = [];
  Object.keys(seriesMap).sort().forEach(s => {
    const items = seriesMap[s].filter(p => productMatches(p, q));
    if (!items.length) return;
    const cards = [];
    items.forEach(p => {
      const ownedV = p.variants.filter(v => isOwned(v.id)).length;
      const total = p.variants.length;
      if (filterOpts.ownedOnly && ownedV === 0) return;
      if (filterOpts.missingOnly && ownedV === total) return;
      if (filterOpts.wishlistOnly && !p.variants.some(v => isWishlisted(v.id))) return;
      const pct = total > 0 ? (ownedV / total * 100) : 0;
      const badgeHtml = ownedV === total
        ? `<span class="pc-badge done">完成</span>`
        : ownedV > 0
        ? `<span class="pc-badge partial">${ownedV}/${total}</span>`
        : "";
      const cls = ownedV > 0 ? "owned" : "";
      const blades = [...new Set(p.variants
        .map(v => isEmptyPart(v.blade) ? null : bladeName(v.blade))
        .filter(Boolean))];
      const nameStr = blades.length === 0 ? ""
        : blades.length > 2 ? blades.slice(0, 2).join("、") + ` +${blades.length - 2}`
        : blades.join("、");
      const coats = [...new Set(p.variants.map(v => v.opts?.coat).filter(Boolean))];
      const coatHtml = coats.length ? coats.map(c =>
        `<span class="pc-coat" style="--coat:${c}"><span class="pc-coat-dot" style="background:${c}"></span>${coatName(c)}</span>`
      ).join("") : "";
      const attrSet = new Set();
      p.variants.forEach(v => {
        if (!isEmptyPart(v.blade)) {
          const info = bladeInfo(v.blade);
          if (info.attr) info.attr.forEach(a => { if (["att","def","sta","bal"].includes(a)) attrSet.add(a); });
        }
      });
      const ATTR_LABEL = { att: "攻擊", def: "防禦", sta: "持久", bal: "平衡" };
      const attrHtml = [...attrSet].map(a => `<span class="pill ${a}">${ATTR_LABEL[a]}</span>`).join("");
      cards.push(`<div class="product-card ${cls}" onclick="select('product','${p.id}')">
        <div class="pc-header">
          <span class="pc-code">${p.id}</span>
          ${badgeHtml}
        </div>
        <span class="pc-type">${productTypeName(p.type)} · ${total} 款</span>
        ${nameStr ? `<span class="pc-name">${nameStr}</span>` : ""}
        ${attrHtml || coatHtml ? `<div class="pc-tags">${attrHtml}${coatHtml}</div>` : ""}
        <img class="pc-img" src="${productImageSrc(p.id)}" alt="${p.id}" loading="lazy" onerror="this.outerHTML='<div class=\\'pc-noimg\\'>暫無圖片</div>'">
        <div class="pc-foot">
          <span>${ownedV}/${total}</span>
          <div class="pc-bar"><div class="pc-bar-fill" style="width:${pct}%"></div></div>
        </div>
      </div>`);
    });
    if (cards.length) {
      const gkey = "products:" + s;
      const collapsed = collapsedGroups.has(gkey);
      html.push(`<div class="group ${collapsed ? "collapsed" : ""}">
        <div class="group-head" onclick="toggleGroup('${gkey}')">
          <span>${s} 系列</span>
          <span class="count">${cards.length} / ${items.length}</span>
        </div>
        <div class="group-body"><div class="product-grid">${cards.join("")}</div></div>
      </div>`);
    }
  });
  return html.join("") || `<div class="empty">沒有符合條件的商品</div>`;
}

function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

// 代號用「字界開頭」比對 (R 不會撈到 DrSt)，中文用子字串
// 同時把連字符忽略 (UX09 可以命中 UX-09)
function codeMatches(text, q) {
  if (!text) return false;
  const norm = s => s.replace(/-/g, "");
  return new RegExp("(?:^|[^A-Za-z0-9])" + escapeRegex(norm(q)), "i").test(norm(text));
}
function chiMatches(text, q) {
  return text && text.toLowerCase().includes(q.toLowerCase());
}

function productMatches(p, q) {
  if (!q) return true;
  if (codeMatches(p.id, q)) return true;
  return p.variants.some(v => variantMatches(v, q));
}

function variantMatches(v, q) {
  return codeMatches(v.raw, q)
    || chiMatches(bladeName(v.blade), q)
    || chiMatches(bitName(v.bit), q);
}

function renderPartList(q) {
  const op = ownedParts();
  const sections = [
    { key: "blade", title: "戰刃 Blade", items: [...ALL_BLADES].sort(), info: bladeInfo, owned: op.blades },
    { key: "ratchet", title: "固鎖 Ratchet", items: [...ALL_RATCHETS].sort(), info: ratchetInfo, owned: op.ratchets },
    { key: "bit", title: "軸 Bit", items: [...ALL_BITS].sort(), info: bitInfo, owned: op.bits },
  ];
  return sections.map(sec => {
    const filtered = sec.items.filter(code => {
      const isO = sec.owned.has(code);
      if (filterOpts.ownedOnly && !isO) return false;
      if (filterOpts.missingOnly && isO) return false;
      if (q) {
        const info = sec.info(code);
        const chi = info.names ? info.names.chi || "" : "";
        const eng = info.names ? info.names.eng || "" : "";
        if (codeMatches(code, q) || codeMatches(eng, q) || chiMatches(chi, q)) return true;
        // 也用商品代號搜尋: ux09 → 找出 UX-09 包含的零件
        const sources = PART_SOURCES[sec.key][code] || [];
        return sources.some(v => codeMatches(v.productId, q));
      }
      return true;
    });
    if (!filtered.length) return "";
    const gkey = "parts:" + sec.key;
    const collapsed = collapsedGroups.has(gkey);
    return `<div class="group ${collapsed ? "collapsed" : ""}">
      <div class="group-head" onclick="toggleGroup('${gkey}')">
        <span>${sec.title}</span>
        <span class="count">${[...sec.owned].filter(c => sec.items.includes(c)).length} / ${sec.items.length}</span>
      </div>
      <div class="group-body">
        ${filtered.map(code => {
          const info = sec.info(code);
          const isO = sec.owned.has(code);
          const cls = (isO ? "owned" : "") + (selected && selected.type === sec.key && selected.id === code ? " selected" : "");
          const cn = sec.key === "ratchet" ? "" :
                     sec.key === "blade" ? bladeName(code) :
                     bitName(code);
          const display = cn
            ? `${cn} <span style='color:var(--muted); font-family:monospace; font-size:11px;'>${code}</span>`
            : `<span style='font-family:monospace;'>${code}</span>`;
          let thumb = "";
          if (sec.key === "bit") {
            thumb = `<img class="item-thumb" src="${bitImageSrc(code)}" loading="lazy" onerror="this.style.visibility='hidden'">`;
          } else if (sec.key === "ratchet") {
            thumb = `<img class="item-thumb" src="${ratchetImageSrc(code)}" loading="lazy" onerror="this.style.visibility='hidden'">`;
          } else if (sec.key === "blade") {
            const single = bladeImageSrc(code);
            if (single) {
              thumb = `<img class="item-thumb" src="${single}" loading="lazy" onerror="this.style.visibility='hidden'">`;
            } else {
              const segs = cxBladeSegments(code).filter(Boolean);
              const chip = segs.find(s => s.cat === "chip") || segs[0];
              if (chip) thumb = `<img class="item-thumb" src="${chip.src}" loading="lazy" onerror="this.style.visibility='hidden'">`;
            }
          }
          return `<div class="item ${cls}" onclick="select('${sec.key}','${escapeAttr(code)}')">
            <span class="check">${isO ? "●" : "○"}</span>
            ${thumb}
            <span class="name">${display}</span>
            <span class="qty">${PART_SOURCES[sec.key][code].length}</span>
          </div>`;
        }).join("")}
      </div>
    </div>`;
  }).join("") || `<div class="empty">沒有符合條件的零件</div>`;
}

function escapeAttr(s) { return s.replace(/'/g, "\\'"); }

function select(type, id) {
  selected = { type, id };
  render();
  const m = document.querySelector(".main");
  if (m) m.scrollTop = 0;
}

function renderDetail() {
  const el = document.getElementById("detail");
  const back = `<div class="mobile-back-bar"><button onclick="goBack()">← 返回</button></div>`;
  if (activeTab === "mine") { el.innerHTML = back + renderCollection(); return; }
  if (activeTab === "tier") { el.innerHTML = back + renderTier(); return; }
  if (activeTab === "news") { el.innerHTML = back + renderNews(); return; }
  if (activeTab === "builds") {
    if (!selected) { el.innerHTML = back + `<div class="empty">← 從左側選配置，或按「+ 新增配置」</div>`; return; }
    el.innerHTML = back + renderBuildEditor(selected.id);
    return;
  }
  if (!selected) { el.innerHTML = `<div class="empty">← 從左側清單選一個項目開始</div>`; return; }
  if (selected.type === "product") el.innerHTML = back + renderProductDetail(PRODUCTS[selected.id]);
  else el.innerHTML = back + renderPartDetail(selected.type, selected.id);
}

function renderBuildEditor(id) {
  const b = getBuild(id);
  if (!b) return `<div class="empty">配置不存在</div>`;
  const op = ownedParts();
  const status = buildStatus(b);
  const slot = (key, label, code, info, nameFn, ownedSet) => {
    const inf = code ? info(code) : null;
    const cn = code ? nameFn(code, inf) : "";
    const ow = code && ownedSet.has(code);
    // 縮圖：橫向卡片佈局，固定 60px 高
    let thumbHtml = "";
    if (code) {
      const thumbStyle = "width:60px; height:60px; object-fit:contain; flex-shrink:0; background:rgba(255,255,255,0.02); border-radius:4px;";
      if (key === "blade") {
        const single = bladeImageSrc(code);
        if (single) {
          thumbHtml = `<img style="${thumbStyle}" src="${single}" alt="${code}" onerror="this.style.visibility='hidden'">`;
        } else {
          const segs = cxBladeSegments(code).filter(Boolean);
          if (segs.length) {
            // CX 組合：用第一段 (通常是 chip) 當代表縮圖
            const head = segs.find(s => s.cat === "chip") || segs[0];
            thumbHtml = `<img style="${thumbStyle}" src="${head.src}" alt="${head.abbr}" onerror="this.style.visibility='hidden'">`;
          }
        }
      } else if (key === "ratchet") {
        thumbHtml = `<img style="${thumbStyle}" src="${ratchetImageSrc(code)}" alt="${code}" onerror="this.style.visibility='hidden'">`;
      } else if (key === "bit") {
        thumbHtml = `<img style="${thumbStyle}" src="${bitImageSrc(code)}" alt="${code}" onerror="this.style.visibility='hidden'">`;
      }
    }
    const attrPills = [];
    if (inf?.attr) {
      const ATTR_L = { att: "攻擊", def: "防禦", sta: "持久", bal: "平衡" };
      inf.attr.forEach(a => { if (ATTR_L[a]) attrPills.push(`<span class="pill ${a}">${ATTR_L[a]}</span>`); });
      if (inf.attr.includes("left")) attrPills.push(`<span class="pill">左旋</span>`);
    }
    const showCode = key === "blade" && cn && cn !== code;
    const body = code
      ? `<div style="display:flex; gap:10px; align-items:center; margin-top:6px;">
           ${thumbHtml}
           <div style="flex:1; min-width:0;">
             <div style="font-size:15px; font-weight:600; line-height:1.3;">${cn || code}</div>
             ${showCode ? `<div style="color:var(--muted); font-size:11px; font-family:monospace; margin-top:2px;">${code}</div>` : ""}
             ${attrPills.length ? `<div style="margin-top:3px;">${attrPills.join("")}</div>` : ""}
             ${inf?.desc ? `<div style="color:var(--muted); font-size:11px; margin-top:3px; line-height:1.4;">${inf.desc}</div>` : ""}
           </div>
         </div>`
      : `<div style="margin-top:6px; color:var(--muted);">— 未選 —</div>`;
    const owPill = code ? (ow ? `<span class="pill owned">已擁有</span>` : `<span class="pill missing">未擁有</span>`) : "";
    const clearBtn = code ? `<div style="display:flex; justify-content:flex-end; margin-top:8px;"><button onclick="event.stopPropagation(); updateBuildField('${id}','${key}',''); render();" style="font-size:11px; padding:3px 8px;" class="danger">清除</button></div>` : "";
    return `<div class="card" style="cursor:pointer" onclick="openPartPicker('${id}','${key}')">
      <div style="display:flex; align-items:center; gap:8px;">
        <h3 style="margin:0; font-size:13px; color:var(--accent2);">${label}</h3>
        ${owPill}
        <span style="margin-left:auto; color:var(--muted); font-size:11px;">${code ? "點此變更" : "點此選擇"} ▸</span>
      </div>
      ${body}
      ${clearBtn}
    </div>`;
  };
  const statusPill = status.need === 0
    ? `<span class="pill" style="background:var(--panel2);">尚未選擇任何零件</span>`
    : status.complete ? `<span class="pill owned">✓ 全部擁有，可組裝</span>`
    : `<span class="pill missing">缺 ${status.missing} 件 / ${status.need}</span>`;
  return `<div>
    <div style="display:flex; gap:8px; margin-bottom:14px; align-items:center; flex-wrap:wrap;">
      <input type="text" placeholder="配置名稱 (例: 蒼龍爆刃)" value="${(b.name || '').replace(/"/g, '&quot;')}"
             oninput="updateBuildField('${id}','name', this.value)"
             style="flex:1; min-width:160px; padding:8px 10px; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:6px;">
      <button onclick="duplicateBuild('${id}')">複製</button>
      <button class="danger" onclick="deleteBuild('${id}')">刪除</button>
    </div>
    <div style="margin-bottom:12px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
      ${statusPill}
      <label style="display:flex; align-items:center; gap:8px; margin-left:auto; font-size:12px; color:var(--muted); cursor:pointer;">
        CX 組合刃
        <span class="switch"><input type="checkbox" ${b.cx ? "checked" : ""} onchange="toggleBuildCx('${id}', this.checked)"><span class="slider"></span></span>
      </label>
    </div>
    ${b.cx ? renderCxSlots(id, b, op) : slot("blade", "戰刃 Blade", b.blade, bladeInfo, (c) => bladeName(c), op.blades)}
    ${slot("ratchet", "固鎖 Ratchet", b.ratchet, ratchetInfo, () => "", op.ratchets)}
    ${slot("bit", "軸 Bit", b.bit, bitInfo,
      (c, i) => preferredChi(i && i.names && i.names.chi), op.bits)}
    <textarea placeholder="備註"
              oninput="updateBuildField('${id}','note', this.value)"
              style="width:100%; min-height:60px; margin-top:14px; padding:8px; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:6px; font-family:inherit;">${(b.note || '').replace(/</g, '&lt;')}</textarea>
  </div>`;
}

function toggleBuildCx(id, on) {
  const b = getBuild(id); if (!b) return;
  b.cx = on;
  if (on) { b.blade = ""; b.chip = b.chip || ""; b.main = b.main || ""; b.over = b.over || ""; b.assist = b.assist || ""; }
  else { b.chip = ""; b.main = ""; b.over = ""; b.assist = ""; }
  saveState(); render();
}
const CX_SLOT_LABELS = { chip: "紋章 Chip", main: "超越戰刃 Over Blade", over: "鋼鐵戰刃 Metal Blade", assist: "輔助戰刃 Assist Blade" };
function renderCxSlots(id, b, op) {
  const cx = (DB.bladeDivided && DB.bladeDivided.CX) || {};
  const cxSegs = ownedCxSegments();
  return ["chip", "main", "over", "assist"].map(cat => {
    const code = b[cat] || "";
    const parts = cx[cat] || {};
    const ownSet = cat === "main" ? new Set([...cxSegs.main, ...cxSegs.metal]) : cxSegs[cat];
    const ow = code && ownSet && ownSet.has(code);
    const inf = code ? (parts[code] || {}) : null;
    const cn = inf?.names ? (preferredChi(inf.names.chi) || inf.names.eng || "") : "";
    const thumbStyle = "width:50px; height:50px; object-fit:contain; flex-shrink:0; background:rgba(255,255,255,0.02); border-radius:4px;";
    const thumbSrc = code ? `blades/CX/${cat}/${encodeURIComponent(code)}.png` : "";
    const thumbHtml = code ? `<img style="${thumbStyle}" src="${thumbSrc}" alt="${code}" onerror="this.style.visibility='hidden'">` : "";
    const attrPills = [];
    if (inf?.attr) {
      const ATTR_L = { att: "攻擊", def: "防禦", sta: "持久", bal: "平衡" };
      inf.attr.forEach(a => { if (ATTR_L[a]) attrPills.push(`<span class="pill ${a}">${ATTR_L[a]}</span>`); });
    }
    const body = code
      ? `<div style="display:flex; gap:10px; align-items:center; margin-top:6px;">
           ${thumbHtml}
           <div style="flex:1; min-width:0;">
             <div style="font-size:14px; font-weight:600;">${cn || code}</div>
             ${cn && cn !== code ? `<div style="color:var(--muted); font-size:11px; font-family:monospace;">${code}</div>` : ""}
             ${attrPills.length ? `<div style="margin-top:2px;">${attrPills.join("")}</div>` : ""}
             ${inf?.desc ? `<div style="color:var(--muted); font-size:11px; margin-top:2px; line-height:1.4;">${inf.desc}</div>` : ""}
           </div>
         </div>`
      : `<div style="margin-top:6px; color:var(--muted);">— 未選 —</div>`;
    const clearBtn = code ? `<div style="display:flex; justify-content:flex-end; margin-top:6px;"><button onclick="event.stopPropagation(); updateBuildField('${id}','${cat}',''); render();" style="font-size:11px; padding:3px 8px;" class="danger">清除</button></div>` : "";
    const owPill = code ? (ow ? `<span class="pill owned">已擁有</span>` : `<span class="pill missing">未擁有</span>`) : "";
    return `<div class="card" style="cursor:pointer" onclick="openCxPicker('${id}','${cat}')">
      <div style="display:flex; align-items:center; gap:8px;">
        <h3 style="margin:0; font-size:13px; color:var(--accent2);">${CX_SLOT_LABELS[cat]}</h3>
        ${owPill}
        <span style="margin-left:auto; color:var(--muted); font-size:11px;">${code ? "點此變更" : "點此選擇"} ▸</span>
      </div>
      ${body}
      ${clearBtn}
    </div>`;
  }).join("");
}
function openCxPicker(buildId, cat) {
  pickerCtx = { buildId, slot: "cx_" + cat, cxCat: cat, query: "", onlyOwned: false };
  showModal(`選擇 ${CX_SLOT_LABELS[cat]}`, `
    <div style="display:flex; gap:8px; margin-bottom:8px; align-items:center; flex-wrap:wrap;">
      <input type="search" id="picker-q" placeholder="搜尋代號 / 中文名"
             oninput="pickerCtx.query = this.value; renderPartPickerList();"

    </div>
    <div id="picker-list" style="max-height: 50vh; overflow:auto; border:1px solid var(--border); border-radius:6px;"></div>
  `, [
    { label: "取消", action: () => { pickerCtx = null; closeModal(); } }
  ]);

  setTimeout(() => { const e = document.getElementById("picker-q"); if (e) e.focus(); }, 30);
}

let pickerCtx = null;
function openPartPicker(buildId, slot) {
  pickerCtx = { buildId, slot, query: "", onlyOwned: false };
  const slotName = slot === "blade" ? "戰刃" : slot === "ratchet" ? "固鎖" : "軸";
  // 只在開啟時 build 一次 modal 殼，後續搜尋只更新內部 list (避免 input 失焦)
  showModal(`選擇 ${slotName}`, `
    <div style="display:flex; gap:8px; margin-bottom:8px; align-items:center; flex-wrap:wrap;">
      <input type="search" id="picker-q" placeholder="搜尋代號 / 中文名 / 商品代號 (例: UX01)"
             oninput="pickerCtx.query = this.value; renderPartPickerList();"
             style="flex:1; min-width:160px; padding:8px; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:6px;">
      <label style="display:flex; align-items:center; gap:4px; color:var(--muted); font-size:12px; white-space:nowrap;">
        <input type="checkbox" id="picker-owned" onchange="pickerCtx.onlyOwned = this.checked; renderPartPickerList();"> 只看擁有
      </label>

    <div id="picker-list" style="max-height: 50vh; overflow:auto; border:1px solid var(--border); border-radius:6px;"></div>
