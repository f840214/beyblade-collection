<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2a4a8e"/>
      <stop offset="100%" stop-color="#0a1226"/>
    </radialGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7cf"/>
      <stop offset="100%" stop-color="#4ea1ff"/>
    </linearGradient>
    <linearGradient id="hex" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8e0ff"/>
      <stop offset="100%" stop-color="#5da0e0"/>
    </linearGradient>
  </defs>

  <!-- 圓角方背景 -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- 旋轉陀螺 -->
  <g transform="translate(256 256)">
    <!-- 6 枚刃 -->
    <g fill="url(#blade)" stroke="#0a1226" stroke-width="6" stroke-linejoin="round">
      <polygon points="0,-160 55,-70 -55,-70"/>
      <polygon points="0,-160 55,-70 -55,-70" transform="rotate(60)"/>
      <polygon points="0,-160 55,-70 -55,-70" transform="rotate(120)"/>
      <polygon points="0,-160 55,-70 -55,-70" transform="rotate(180)"/>
      <polygon points="0,-160 55,-70 -55,-70" transform="rotate(240)"/>
      <polygon points="0,-160 55,-70 -55,-70" transform="rotate(300)"/>
    </g>

    <!-- 中央六角 -->
    <polygon points="0,-72 62,-36 62,36 0,72 -62,36 -62,-36"
             fill="url(#hex)" stroke="#0a1226" stroke-width="6" stroke-linejoin="round"/>

    <!-- 中心軸 -->
    <circle r="22" fill="#0a1226"/>
    <circle r="10" fill="#a8e0ff"/>
  </g>
</svg>
