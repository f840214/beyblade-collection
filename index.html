// gzip + base64 編解碼 (用於「短碼」格式)
const SHORT_PREFIX = "BEYX1:";
async function compressToShortCode(jsonStr) {
  const stream = new Blob([jsonStr]).stream().pipeThrough(new CompressionStream("gzip"));
  const buf = new Uint8Array(await new Response(stream).arrayBuffer());
  let bin = ""; for (let i = 0; i < buf.length; i++) bin += String.fromCharCode(buf[i]);
  return SHORT_PREFIX + btoa(bin);
}
async function decompressFromShortCode(code) {
  // iOS 會把前綴轉小寫；用 regex 不分大小寫剝掉任何 "xxxN:" 開頭
  const b64 = code.replace(/^[A-Za-z]+\d*:/i, "").replace(/\s+/g, "");
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  return await new Response(stream).text();
}
function looksLikeShortCode(s) {
  return /^[A-Za-z]+\d*:/i.test(s) || (!s.startsWith("{") && /^[A-Za-z0-9+/=\s]+$/.test(s));
}

function openExportShare(initial = "image") {

}
function _switchExpsMode(m) { _expsMode = m; _renderExpShare(); }
function _renderExpShare() {
  const mode = _expsMode;

    `;
    actions = [
      { label: "💾 下載", primary: true, action: downloadShareImage },

      <p style="color:var(--muted); margin:0 0 6px; font-size:12px;" id="fmt-hint"></p>
      <textarea class="io" id="io-text" readonly></textarea>
    `;
    actions = [
      { label: "📋 複製", action: () => {
        navigator.clipboard.writeText(document.getElementById("io-text").value);
        alert("已複製到剪貼簿");
      }},
      { label: "💾 下載", primary: true, action: () => {
        const ext = mode === "json" ? "json" : "txt";
        const blob = new Blob([document.getElementById("io-text").value], { type: "text/plain" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);

  }
}

async function _populateExportText(fmt) {
  const exportData = {
    schema: "beyx_collection", version: 1,
    exportedAt: new Date().toISOString(),
    owned: state.owned,
    builds: state.builds || [],
    wishlist: state.wishlist || {},
  };
  const json = JSON.stringify(exportData, null, fmt === "json" ? 2 : 0);
  const ta = document.getElementById("io-text");
  const hint = document.getElementById("fmt-hint");
  if (!ta || !hint) return;
  if (fmt === "json") {
    ta.value = json;
    hint.textContent = `JSON 格式，${json.length} 字元。可直接看內容、易於版本控制。`;
  } else {
    ta.value = "壓縮中…";
    const code = await compressToShortCode(JSON.stringify({ schema: "beyx_collection", version: 1, owned: state.owned, builds: state.builds || [] }));
    if (_expsMode !== fmt) return; // user switched away while compressing
    ta.value = code;
    hint.textContent = `短碼格式，${code.length} 字元 (壓縮率 ${(code.length / json.length * 100).toFixed(0)}%)。一行字串，方便分享/備份。`;
  }
}

function openImport() {
  showModal("匯入收藏", `
    <p style="color:var(--muted); margin-top:0;">貼上之前匯出的 <b>JSON 內容</b>或 <b>短碼</b>(以 BEYX1: 開頭)。也可以選擇檔案。</p>
    <div style="display:flex; gap:6px; margin-bottom:8px; align-items:center; flex-wrap:wrap;">
      <button type="button" onclick="pasteIntoImport()" style="white-space:nowrap; flex-shrink:0;">📋 從剪貼簿貼上</button>
      <input type="file" accept=".json,.txt,application/json,text/plain" onchange="loadFile(this.files[0])" style="flex:1; min-width:140px;">
    </div>
    <textarea class="io" id="io-text" placeholder='{"owned": {"BX-35#3": 1, ...}}  或  BEYX1:H4sIAAAAAA...'></textarea>
    <div style="color: var(--warn); font-size: 12px; margin-top: 6px;" id="io-warn"></div>
  `, [
    { label: "🔁 取代", primary: true, action: () => doImport(true) },
    { label: "➕ 合併", action: () => doImport(false) },

  ]);

async function pasteIntoImport() {
  const ta = document.getElementById("io-text");
  const warn = document.getElementById("io-warn");
  warn.textContent = "";
  try {
    const text = await navigator.clipboard.readText();
    if (text) { ta.value = text; ta.focus(); }
    else warn.textContent = "剪貼簿是空的";
  } catch (e) {
    warn.textContent = "無法讀取剪貼簿，請改用長按手動貼上 (" + e.message + ")";
  }
}

function loadFile(f) {
  if (!f) return;
  const r = new FileReader();
  r.onload = () => { document.getElementById("io-text").value = r.result; };
  r.readAsText(f);
}

async function doImport(replace) {
  const txt = document.getElementById("io-text").value.trim();
  if (!txt) return;
  const warnEl = document.getElementById("io-warn");
  let json = txt;
  if (looksLikeShortCode(txt)) {
    try { json = await decompressFromShortCode(txt); }
    catch (e) { warnEl.textContent = "短碼解壓失敗：" + e.message; return; }
  }
  let data;
  try { data = JSON.parse(json); }
  catch (e) { warnEl.textContent = "解析失敗：" + e.message; return; }
  const owned = data.owned || data;
  if (typeof owned !== "object") {
    warnEl.textContent = "找不到 owned 欄位";
    return;
  }
  const validIds = new Set(VARIANTS.map(v => v.id));
  const next = replace ? {} : { ...state.owned };
  let added = 0, skipped = 0;
  Object.entries(owned).forEach(([k, v]) => {
    const qty = parseInt(v) || 0;
    if (qty <= 0) return;
    if (!validIds.has(k)) { skipped++; return; }
    next[k] = qty;
    added++;
  });
  state.owned = next;
  // 一併匯入配置 (builds)
  if (Array.isArray(data.builds)) {
    state.builds = replace ? data.builds : [...(state.builds || []), ...data.builds];
  }
  // 一併匯入願望清單
  if (data.wishlist && typeof data.wishlist === "object") {
    state.wishlist = replace ? data.wishlist : { ...(state.wishlist || {}), ...data.wishlist };
  }
  saveState();
  closeModal();
  render();
  alert(`匯入完成：套用 ${added} 筆${skipped ? `，略過 ${skipped} 筆無效 id` : ""}` +
    (Array.isArray(data.builds) ? `\n配置：${data.builds.length} 筆` : ""));
}

function clearAll() {
  if (!confirm("確定要清空所有擁有紀錄與配置？")) return;
  state.owned = {};
  state.builds = [];
  selected = null;
  saveState();
  render();
}

async function updateSharePreview() {
  clearTimeout(_shareDebounce);
  const previewEl = document.getElementById("share-preview");
  if (!previewEl) return;
  previewEl.innerHTML = `<div style="padding:30px; color:var(--muted);">產生中…</div>`;
  _shareBlob = null;
  const includeCode = !!document.getElementById("share-include-code")?.checked;
  const customTitle = (document.getElementById("share-title")?.value || "").trim();
  try {
    const blob = await buildShareImageBlob({ includeCode, customTitle });
    _shareBlob = blob;
    const url = URL.createObjectURL(blob);
    previewEl.innerHTML = `<img src="${url}" style="max-width:100%; height:auto; border-radius:6px;">`;

    img.onload = () => URL.revokeObjectURL(url);

    previewEl.innerHTML = `<div style="padding:30px; color:var(--missing);">產生失敗：${e.message}</div>`;
  }

  if (!_shareBlob) { alert("圖片尚未產生"); return; }

  a.href = url;
  a.download = `beyx-collection-${new Date().toISOString().slice(0, 10)}.png`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);

async function shareImageNow() {
  if (!_shareBlob) { alert("圖片尚未產生"); return; }
  const file = new File([_shareBlob], `beyx-collection-${new Date().toISOString().slice(0,10)}.png`, { type: "image/png" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: "Beyblade X 收藏" });
    } catch (e) {
      if (e.name !== "AbortError") alert("分享失敗：" + e.message);
    }
  } else {
    downloadShareImage();
  }
}

// 直接畫到 canvas (避開 SVG foreignObject 在 Safari 的限制)
async function buildShareImageBlob(opts) {
  const { includeCode, customTitle } = opts || {};
  const title = (customTitle && customTitle.trim()) || "Beyblade X 收藏";
  const op = ownedParts();
  const ownedProds = PRODUCT_LIST.filter(p => p.variants.some(v => isOwned(v.id)));
  const ownedVarCount = Object.keys(state.owned).length;
  const dateStr = new Date().toISOString().slice(0, 10);

  const bySeries = {};
  ownedProds.forEach(p => {
    const s = productSeries(p.id);
    (bySeries[s] = bySeries[s] || []).push(p);
  });
  const seriesKeys = Object.keys(bySeries).sort();
  const ownedRatchets = [...op.ratchets].sort();
  const ownedBits = [...op.bits].sort();

  let shortCode = "";
  if (includeCode) {
    shortCode = await compressToShortCode(JSON.stringify({
      schema: "beyx_collection", version: 1,
      owned: state.owned, builds: state.builds || [],
    }));
  }

  const W = 1080;
  const PADX = 60, PADTOP = 50, PADBOT = 50;
  const INNER = W - PADX * 2;
  const FFAM = `-apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif`;
  const f = (sz, w) => `${w ? w + " " : ""}${sz}px ${FFAM}`;
  const FONT_TITLE   = f(44, 700);
  const FONT_DATE    = f(20);
  const FONT_LABEL   = f(16);
  const FONT_NUM     = f(34, 700);
  const FONT_TOT     = f(18);
  const FONT_SECTION = f(24, 600);
  const FONT_SERIES  = f(15);
  const FONT_PILL    = f(16);
  const FONT_FOOTER  = f(13);
  const FONT_CODE    = `13px ui-monospace, SFMono-Regular, Menlo, monospace`;
  const C = {
    bg: "#0f1115", panel: "#1f232c", text: "#e6e9ef", muted: "#8a93a3",
    accent2: "#7cf", owned: "#2ecc71", border: "#2a2f3a", code: "#c0c4cd",
  };

  // 用 dummy ctx 量字寬
  const mctx = document.createElement("canvas").getContext("2d");
  function tw(text, font) { mctx.font = font; return mctx.measureText(text).width; }

  function layoutPills(items, getText, font, padX = 14, height = 32, gap = 8, maxWidth = INNER) {
    const rows = [[]];
    let curW = 0;
    for (const it of items) {
      const w = tw(getText(it), font) + padX * 2;
      if (curW > 0 && curW + gap + w > maxWidth) { rows.push([]); curW = 0; }
      rows[rows.length - 1].push({ item: it, w, h: height, label: getText(it) });
      curW += (curW > 0 ? gap : 0) + w;
    }
    return { rows, totalH: rows.length * height + (rows.length - 1) * gap };
  }

  function wrapMono(text, font, maxWidth) {
    const lines = [];
    let cur = "";
    for (const ch of text) {
      const test = cur + ch;
      if (tw(test, font) > maxWidth) { lines.push(cur); cur = ch; }
      else cur = test;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  // 量高度
  const sections = [];
  sections.push({ kind: "header", h: 56 + 30 });
  sections.push({ kind: "stats", h: 96 + 32 });
  sections.push({ kind: "section-h", text: `擁有商品 ${ownedProds.length}`, h: 32 + 14 });
  if (ownedProds.length === 0) {
    sections.push({ kind: "empty", text: "還沒有任何擁有紀錄", h: 32 });
  } else {
    for (const sk of seriesKeys) {
      const layout = layoutPills(bySeries[sk], p => p.id, FONT_PILL);
      sections.push({ kind: "series", series: sk, layout, h: 22 + 10 + layout.totalH + 14 });
    }
  }
  if (ownedRatchets.length) {
    const layout = layoutPills(ownedRatchets, c => c, FONT_PILL);
    sections.push({ kind: "section-h", text: `擁有固鎖 ${ownedRatchets.length}`, h: 32 + 14 });
    sections.push({ kind: "pills", layout, h: layout.totalH + 14 });
  }
  if (ownedBits.length) {
    const layout = layoutPills(ownedBits, c => c, FONT_PILL);
    sections.push({ kind: "section-h", text: `擁有軸 ${ownedBits.length}`, h: 32 + 14 });
    sections.push({ kind: "pills", layout, h: layout.totalH + 14 });
  }
  let codeLines = null;
  if (shortCode) {
    codeLines = wrapMono(shortCode, FONT_CODE, INNER);
    const h = 24 + 24 + 8 + codeLines.length * 18 + 8;
    sections.push({ kind: "code", lines: codeLines, h });
  }
  sections.push({ kind: "footer", h: 24 });

  const contentH = sections.reduce((a, s) => a + s.h, 0);
  const H = PADTOP + contentH + PADBOT;

  // 畫
  const canvas = document.createElement("canvas");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);

  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);

  function drawText(text, x, y, font, color, baseline = "top", align = "left") {
    ctx.font = font;
    ctx.fillStyle = color;
    ctx.textBaseline = baseline;
    ctx.textAlign = align;
    ctx.fillText(text, x, y);
  }
  function roundRectPath(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  let y = PADTOP;
  for (const s of sections) {
    if (s.kind === "header") {
      // 標題太長就縮字級避免被日期擠到
      const dateW = tw(dateStr, FONT_DATE);
      const maxTitleW = INNER - dateW - 20;
      let titleFont = FONT_TITLE;
      let titleSize = 44;
      while (tw(title, titleFont) > maxTitleW && titleSize > 22) {
        titleSize -= 2;
        titleFont = f(titleSize, 700);
      }
      drawText(title, PADX, y, titleFont, C.text, "top", "left");
      drawText(dateStr, W - PADX, y + 12, FONT_DATE, C.muted, "top", "right");
    } else if (s.kind === "stats") {
      const gap = 12;
      const boxW = (INNER - gap * 3) / 4;
      const boxH = 96;
      const stats = [
        ["陀螺戰士", ownedVarCount, VARIANTS.length],
        ["戰刃", op.blades.size, ALL_BLADES.size],
        ["固鎖", op.ratchets.size, ALL_RATCHETS.size],
        ["軸", op.bits.size, ALL_BITS.size],
      ];
      stats.forEach(([label, n, t], i) => {
        const x = PADX + i * (boxW + gap);
        ctx.fillStyle = C.panel;
        roundRectPath(x, y, boxW, boxH, 12);
        ctx.fill();
        drawText(label, x + boxW / 2, y + 22, FONT_LABEL, C.muted, "top", "center");
        const numStr = String(n);
        const totStr = " / " + t;
        const numW = tw(numStr, FONT_NUM);
        const totW = tw(totStr, FONT_TOT);
        const totalW = numW + totW;
        const sx = x + (boxW - totalW) / 2;
        drawText(numStr, sx, y + 50, FONT_NUM, C.owned, "top", "left");
        drawText(totStr, sx + numW, y + 64, FONT_TOT, C.muted, "top", "left");
      });
    } else if (s.kind === "section-h") {
      drawText(s.text, PADX, y, FONT_SECTION, C.accent2, "top", "left");
    } else if (s.kind === "empty") {
      drawText(s.text, PADX, y, FONT_PILL, C.muted, "top", "left");
    } else if (s.kind === "series" || s.kind === "pills") {
      let py = y;
      if (s.kind === "series") {
        drawText(s.series, PADX, y, FONT_SERIES, C.muted, "top", "left");
        py = y + 22 + 10;
      }
      const gap = 8;
      for (const row of s.layout.rows) {
        let px = PADX;
        for (const pill of row) {
          ctx.fillStyle = "rgba(46,204,113,0.15)";
          roundRectPath(px, py, pill.w, pill.h, pill.h / 2);
          ctx.fill();
          ctx.strokeStyle = C.owned;
          ctx.lineWidth = 1;
          roundRectPath(px + 0.5, py + 0.5, pill.w - 1, pill.h - 1, (pill.h - 1) / 2);
          ctx.stroke();
          drawText(pill.label, px + pill.w / 2, py + pill.h / 2 + 1, FONT_PILL, C.owned, "middle", "center");
          px += pill.w + gap;
        }
        py += 32 + gap;
      }
    } else if (s.kind === "code") {
      ctx.strokeStyle = C.border;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(PADX, y + 0.5);
      ctx.lineTo(W - PADX, y + 0.5);
      ctx.stroke();
      drawText("匯入用短碼", PADX, y + 22, FONT_LABEL, C.muted, "top", "left");
      let cy = y + 22 + 24 + 8;
      for (const line of s.lines) {
        drawText(line, PADX, cy, FONT_CODE, C.code, "top", "left");
        cy += 18;
      }
    } else if (s.kind === "footer") {
      drawText("beyblade-collection", W / 2, y + 4, FONT_FOOTER, C.muted, "top", "center");
    }
    y += s.h;
  }

  return new Promise((res, rej) => {
    canvas.toBlob(b => b ? res(b) : rej(new Error("canvas.toBlob 失敗")), "image/png");
  });
}

// ============================================================
// Google Drive 同步 (appDataFolder)
// ------------------------------------------------------------
// 把 state ({owned, builds, updatedAt}) 同步到使用者自己的 Google Drive
// 應用資料夾。資料只有使用者本人看得到，本網站後端不存任何東西。
//
// 設定步驟：到 Google Cloud Console 建立 OAuth 2.0 Client ID
// (應用程式類型: 網頁應用程式)，授權的 JavaScript 來源加入本站網址，
// 然後把 client id 填到下面的 GOOGLE_CLIENT_ID。
// ============================================================
const GOOGLE_CLIENT_ID = "130526280028-irofuaj6jimrjp34i2t2efh2cva6hmte.apps.googleusercontent.com";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.appdata";
const DRIVE_FILE_NAME = "beyx-collection.json";
const SYNC_FLAG_KEY = "beyx_sync_signed_in"; // localStorage 中標記「上次有登入過」
const SYNC_TOKEN_KEY = "beyx_sync_token"; // 快取 access token (1 小時內可重用，避免每次重整都重跑 OAuth)
const SYNC_DEBOUNCE_MS = 3000;

function _saveCachedToken(token, expiresIn) {
  const ttl = Math.max(0, (Number(expiresIn) || 3600) - 60); // 留 60 秒安全餘裕
  try {
    localStorage.setItem(SYNC_TOKEN_KEY, JSON.stringify({
      token,
      expiresAt: Date.now() + ttl * 1000,
    }));
  } catch (e) {}
  _scheduleTokenRefresh(ttl);
}
// 取消主動續期: GIS 即使 silent 仍會閃視窗。改成被動 — token 過期就過期，
// 使用者下次主動點同步按鈕才走 interactive 流程拿新 token。
function _scheduleTokenRefresh(_ttlSeconds) { /* no-op */ }
function _loadCachedToken() {
  try {
    const c = JSON.parse(localStorage.getItem(SYNC_TOKEN_KEY) || "null");
    if (c && c.token && c.expiresAt > Date.now()) return c.token;
  } catch (e) {}
  return null;
}
function _clearCachedToken() {
  try { localStorage.removeItem(SYNC_TOKEN_KEY); } catch (e) {}
}

const Sync = {
  accessToken: null,
  fileId: null,
  status: "signed-out", // signed-out | signed-in | syncing | synced | error
  message: "",
  lastSyncAt: 0,
  remoteUpdatedAt: 0,
  _pushTimer: null,
  _pushInFlight: false,
  _pushAgain: false,
};

function _syncSetStatus(status, message = "") {
  Sync.status = status;
  Sync.message = message;
  const btn = document.getElementById("sync-btn");
  const label = document.getElementById("sync-btn-label");
  if (!btn || !label) return;
  btn.classList.remove("syncing", "synced", "error", "signed-out");
  if (status === "syncing") { btn.classList.add("syncing"); label.textContent = "同步中"; }
  else if (status === "synced") { btn.classList.add("synced"); label.textContent = "已同步"; }
  else if (status === "error") { btn.classList.add("error"); label.textContent = "同步錯誤"; }
  else if (status === "signed-in") { label.textContent = "同步"; }
  else { btn.classList.add("signed-out"); label.textContent = "同步"; }
  // 如果同步對話框打開著，重繪
  if (document.getElementById("modal-bg").classList.contains("open") &&
      document.getElementById("sync-dialog-marker")) {
    _renderSyncDialog();
  }
}

function _gisReady() {
  return typeof google !== "undefined" && google.accounts && google.accounts.oauth2;
}

async function _waitForGis(timeoutMs = 5000) {
  const start = Date.now();
  while (!_gisReady()) {
    if (Date.now() - start > timeoutMs) throw new Error("Google 登入腳本載入逾時");
    await new Promise(r => setTimeout(r, 100));
  }
}

// 取得 access token
// mode: "interactive" 會跳同意視窗 (使用者主動點同步登入)
//       "silent"      用 prompt:"none"，需要互動就 fail，絕不彈視窗
//       "default"     用 prompt:""，由 Google 決定彈不彈 (第一次重連時用)
function _requestToken(mode = "default") {
  return new Promise((resolve, reject) => {
    if (!_gisReady()) return reject(new Error("GIS 未就緒"));
    const promptVal = mode === "interactive" ? "consent" : mode === "silent" ? "none" : "";
    const client = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      prompt: promptVal,
      callback: (resp) => {
        if (resp.error) { reject(new Error(resp.error_description || resp.error)); return; }
        Sync.accessToken = resp.access_token;
        _saveCachedToken(resp.access_token, resp.expires_in);
        resolve(resp.access_token);
      },
      error_callback: (err) => reject(new Error(err.message || err.type || "授權失敗")),
    });
    try { client.requestAccessToken({ prompt: promptVal }); }
    catch (e) { reject(e); }
  });
}

async function _driveFetch(path, opts = {}) {
  if (!Sync.accessToken) throw new Error("未授權");
  const headers = Object.assign({ Authorization: "Bearer " + Sync.accessToken }, opts.headers || {});
  const r = await fetch("https://www.googleapis.com/" + path, Object.assign({}, opts, { headers }));
  if (r.status === 401) {
    // token 被 Drive 拒絕 → 清掉快取與本地 token，標示需要使用者重連
    _clearCachedToken();
    Sync.accessToken = null;
    _syncSetStatus("signed-out", "點同步重新連線");
    throw new Error("授權過期，請重新登入");
  }
  return r;
}

async function _findSyncFile() {
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
  const r = await _driveFetch(`drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime)`);
  if (!r.ok) throw new Error("查詢檔案失敗: " + r.status);
  const data = await r.json();
  return data.files && data.files[0] ? data.files[0] : null;
}

async function _downloadSyncFile(fileId) {
  const r = await _driveFetch(`drive/v3/files/${fileId}?alt=media`);
  if (!r.ok) throw new Error("下載失敗: " + r.status);
  return r.json();
}

async function _uploadSyncFile(fileId, body) {
  // multipart upload: 同時送 metadata 和 content
  const metadata = fileId ? {} : { name: DRIVE_FILE_NAME, parents: ["appDataFolder"] };
  const boundary = "beyx_" + Math.random().toString(36).slice(2);
  const payload =
    `--${boundary}\r\n` +
    `Content-Type: application/json; charset=UTF-8\r\n\r\n` +
    JSON.stringify(metadata) + `\r\n` +
    `--${boundary}\r\n` +
    `Content-Type: application/json\r\n\r\n` +
    JSON.stringify(body) + `\r\n` +
    `--${boundary}--`;
  const url = fileId
    ? `upload/drive/v3/files/${fileId}?uploadType=multipart&fields=id,modifiedTime`
    : `upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime`;
  const r = await _driveFetch(url, {
    method: fileId ? "PATCH" : "POST",
    headers: { "Content-Type": `multipart/related; boundary=${boundary}` },
    body: payload,
  });
  if (!r.ok) throw new Error("上傳失敗: " + r.status + " " + (await r.text()).slice(0, 200));
  return r.json();
}

async function syncSignIn() {
  if (!GOOGLE_CLIENT_ID) {
    alert("尚未設定 Google OAuth Client ID。\n\n請開啟 template.html，搜尋 GOOGLE_CLIENT_ID 並填入你在 Google Cloud Console 申請的 Client ID。");
    return;
  }
  try {
    _syncSetStatus("syncing", "登入中…");
    await _waitForGis();
    await _requestToken("interactive");
    localStorage.setItem(SYNC_FLAG_KEY, "1");
    _syncSetStatus("signed-in", "已登入");
    await syncReconcile();
  } catch (e) {
    _syncSetStatus("error", e.message);
  }
}

function syncSignOut() {
  if (Sync.accessToken && _gisReady()) {
    google.accounts.oauth2.revoke(Sync.accessToken, () => {});
  }
  Sync.accessToken = null;
  Sync.fileId = null;
  Sync.remoteUpdatedAt = 0;
  localStorage.removeItem(SYNC_FLAG_KEY);
  _clearCachedToken();
  _syncSetStatus("signed-out", "已登出");
}

// 登入後/啟動後對齊本機與遠端
async function syncReconcile() {
  try {
    _syncSetStatus("syncing", "對齊資料中…");
    const file = await _findSyncFile();
    if (!file) {
      // 遠端沒檔 → 上傳本機 (即使空也建檔，後續才好同步)
      await syncPushNow(true);
      return;
    }
    Sync.fileId = file.id;
    const remote = await _downloadSyncFile(file.id);
    const remoteUpdatedAt = remote && typeof remote.updatedAt === "number" ? remote.updatedAt : 0;
    Sync.remoteUpdatedAt = remoteUpdatedAt;
    const localUpdatedAt = state.updatedAt || 0;
    const localEmpty = Object.keys(state.owned).length === 0 && (state.builds || []).length === 0;

    if (remoteUpdatedAt > localUpdatedAt) {
      // 遠端較新
      if (localEmpty || !localUpdatedAt) {
        _applyRemote(remote);
        _syncSetStatus("synced", "已從雲端拉取");
        Sync.lastSyncAt = Date.now();
      } else {
        // 兩邊都有資料 → 問使用者
        _syncSetStatus("signed-in", "需要選擇方向");
        _promptConflict(remote);
      }
    } else if (localUpdatedAt > remoteUpdatedAt) {
      await syncPushNow(true);
    } else {
      _syncSetStatus("synced", "已是最新");
      Sync.lastSyncAt = Date.now();
    }
  } catch (e) {
    _syncSetStatus("error", e.message);
  }
}

function _applyRemote(remote) {
  _applyingRemote = true;
  try {
    state.owned = (remote && remote.owned) || {};
    state.builds = Array.isArray(remote && remote.builds) ? remote.builds : [];
    state.updatedAt = (remote && remote.updatedAt) || Date.now();
    saveState();
    if (Array.isArray(remote && remote.trajectories)) _trajSetSlots(remote.trajectories);
  } finally {
    _applyingRemote = false;
  }
  render();
}

function _promptConflict(remote) {
  const lOwned = Object.keys(state.owned).length;
  const lBuilds = (state.builds || []).length;
  const lTraj = _trajGetSlots().length;
  const rOwned = Object.keys(remote.owned || {}).length;
  const rBuilds = (remote.builds || []).length;
  const rTraj = (remote.trajectories || []).length;
  const lTime = state.updatedAt ? new Date(state.updatedAt).toLocaleString() : "(未知)";
  const rTime = remote.updatedAt ? new Date(remote.updatedAt).toLocaleString() : "(未知)";
  showModal("同步衝突", `
    <p style="margin-top:0;">本機與雲端各有不同的資料，請選擇一邊：</p>
    <div class="sync-row"><span>本機更新時間</span><span>${lTime}</span></div>
    <div class="sync-row"><span>本機資料</span><span>${lOwned} 個陀螺 / ${lBuilds} 個配置 / ${lTraj} 個軌跡圖</span></div>
    <div class="sync-row"><span>雲端更新時間</span><span>${rTime}</span></div>
    <div class="sync-row"><span>雲端資料</span><span>${rOwned} 個陀螺 / ${rBuilds} 個配置 / ${rTraj} 個軌跡圖</span></div>
    <p style="color: var(--muted); font-size:12px; margin-top:10px;">「合併」會把兩邊的 owned 取較大數量，builds 用 id 去重後保留兩邊。</p>
  `, [
    { label: "用雲端覆蓋本機", action: () => { _applyRemote(remote); closeModal(); _syncSetStatus("synced", "已從雲端拉取"); Sync.lastSyncAt = Date.now(); } },
    { label: "用本機覆蓋雲端", primary: true, action: async () => { closeModal(); await syncPushNow(true); } },
    { label: "合併兩邊", action: async () => { _mergeRemote(remote); closeModal(); await syncPushNow(true); } },
    { label: "稍後決定", action: closeModal },
  ]);
}

function _mergeRemote(remote) {
  _applyingRemote = true;
  try {
    const owned = Object.assign({}, remote.owned || {});
    Object.entries(state.owned).forEach(([k, v]) => {
      owned[k] = Math.max(owned[k] || 0, v);
    });
    const buildsById = new Map();
    (remote.builds || []).forEach(b => b && b.id && buildsById.set(b.id, b));
    (state.builds || []).forEach(b => b && b.id && buildsById.set(b.id, b)); // 本機覆蓋同 id
    state.owned = owned;
    state.builds = [...buildsById.values()];
    state.updatedAt = Date.now();
    saveState();
    // 合併軌跡：用名稱去重，本機優先
    const localSlots = _trajGetSlots();
    const remoteSlots = Array.isArray(remote && remote.trajectories) ? remote.trajectories : [];
    const byName = new Map();
    remoteSlots.forEach(s => s && s.name && byName.set(s.name, s));
    localSlots.forEach(s => s && s.name && byName.set(s.name, s));
    _trajSetSlots([...byName.values()]);
  } finally {
    _applyingRemote = false;
  }
  render();
}

async function syncPushNow(silent = false) {
  if (!Sync.accessToken) return;
  if (Sync._pushInFlight) { Sync._pushAgain = true; return; }
  Sync._pushInFlight = true;
  try {
    if (!silent) _syncSetStatus("syncing", "上傳中…");
    else _syncSetStatus("syncing", "上傳中…");
    const body = { schema: "beyx_collection", version: 1, owned: state.owned, builds: state.builds || [], trajectories: _trajGetSlots(), updatedAt: state.updatedAt || Date.now() };
    const meta = await _uploadSyncFile(Sync.fileId, body);
    Sync.fileId = meta.id;
    Sync.remoteUpdatedAt = body.updatedAt;
    Sync.lastSyncAt = Date.now();
    Sync._pendingSave = false;
    _syncSetStatus("synced", "已上傳");
  } catch (e) {
    _syncSetStatus("error", e.message);
  } finally {
    Sync._pushInFlight = false;
    if (Sync._pushAgain) { Sync._pushAgain = false; scheduleSyncPush(); }
  }
}

function scheduleSyncPush() {
  if (!Sync.accessToken) return; // 未登入不推
  Sync._pendingSave = true;
  clearTimeout(Sync._pushTimer);
  Sync._pushTimer = setTimeout(() => syncPushNow(true), SYNC_DEBOUNCE_MS);
}

// 關頁面時，若還有沒推送的變更，用 keepalive fetch 趕一次最後推送
// (一般 fetch 在頁面卸載時會被取消，keepalive 則保證送出)
function _flushSyncOnUnload() {
  if (!Sync.accessToken || !Sync._pendingSave) return;
  clearTimeout(Sync._pushTimer);
  const body = { schema: "beyx_collection", version: 1, owned: state.owned, builds: state.builds || [], updatedAt: state.updatedAt || Date.now() };
  const metadata = Sync.fileId ? {} : { name: DRIVE_FILE_NAME, parents: ["appDataFolder"] };
  const boundary = "beyx_" + Math.random().toString(36).slice(2);
  const payload =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n` +
    JSON.stringify(metadata) + `\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n` +
    JSON.stringify(body) + `\r\n--${boundary}--`;
  const url = Sync.fileId
    ? `https://www.googleapis.com/upload/drive/v3/files/${Sync.fileId}?uploadType=multipart`
    : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
  try {
    fetch(url, {
      method: Sync.fileId ? "PATCH" : "POST",
      headers: {
        Authorization: "Bearer " + Sync.accessToken,
        "Content-Type": `multipart/related; boundary=${boundary}`,
      },
      body: payload,
      keepalive: true,
    });
    Sync._pendingSave = false;
  } catch (e) {}
}
window.addEventListener("pagehide", _flushSyncOnUnload);
// iOS Safari 切到背景時也可能直接被殺，順便在隱藏時也 flush
window.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") _flushSyncOnUnload();
});

async function syncPullNow() {
  if (!Sync.accessToken) return;
  try {
    _syncSetStatus("syncing", "下載中…");
    const file = Sync.fileId ? { id: Sync.fileId } : await _findSyncFile();
    if (!file) { _syncSetStatus("synced", "雲端沒有資料"); return; }
    Sync.fileId = file.id;
    const remote = await _downloadSyncFile(file.id);
    if (!confirm(`雲端：${Object.keys(remote.owned || {}).length} 個陀螺 / ${(remote.builds || []).length} 個配置 / ${(remote.trajectories || []).length} 個軌跡圖\n更新時間：${remote.updatedAt ? new Date(remote.updatedAt).toLocaleString() : "(未知)"}\n\n用雲端資料覆蓋本機？`)) {
      _syncSetStatus("signed-in");
      return;
    }
    _applyRemote(remote);
    _syncSetStatus("synced", "已從雲端拉取");
    Sync.lastSyncAt = Date.now();
  } catch (e) {
    _syncSetStatus("error", e.message);
  }
}

function openSyncDialog() { _renderSyncDialog(); }
function _renderSyncDialog() {
  const signedIn = !!Sync.accessToken;
  const lastSyncTxt = Sync.lastSyncAt ? new Date(Sync.lastSyncAt).toLocaleString() : "—";
  const localTxt = state.updatedAt ? new Date(state.updatedAt).toLocaleString() : "—";
  const ownedCount = Object.keys(state.owned).length;
  const buildCount = (state.builds || []).length;
  const trajCount = _trajGetSlots().length;
  const statusBadge = ({
    "signed-out": '<span style="color:var(--muted);">未登入</span>',
    "signed-in": '<span style="color:var(--accent);">已登入</span>',
    "syncing": '<span style="color:var(--accent);">同步中…</span>',
    "synced": '<span style="color:var(--owned);">已同步</span>',
    "error": `<span style="color:var(--missing);">錯誤</span>`,
  })[Sync.status] || Sync.status;

  const body = `
    <div id="sync-dialog-marker" style="display:none;"></div>
    <p style="color:var(--muted); margin-top:0; font-size:12px;">
      把收藏同步到你自己的 Google Drive 應用資料夾。<br>
      資料只屬於你的 Google 帳號，網站作者看不到也存不到。
    </p>
    <div class="sync-row"><span>狀態</span><span>${statusBadge}${Sync.message ? ' · <span style="color:var(--muted);">' + Sync.message + "</span>" : ""}</span></div>
    <div class="sync-row"><span>本機資料</span><span>${ownedCount} 個陀螺 / ${buildCount} 個配置 / ${trajCount} 個軌跡圖</span></div>
    <div class="sync-row"><span>本機最後修改</span><span>${localTxt}</span></div>
    <div class="sync-row"><span>最近同步</span><span>${lastSyncTxt}</span></div>
    ${!GOOGLE_CLIENT_ID ? '<p style="color:var(--warn); font-size:12px; margin:8px 0 0;">⚠️ 尚未設定 Client ID。請在 template.html 找到 <code>GOOGLE_CLIENT_ID</code> 填入。</p>' : ""}
  `;
  const actions = [];
  if (!signedIn) {
    actions.push({ label: "🔐 用 Google 登入", primary: true, action: syncSignIn });
  } else {
    actions.push({ label: "⬆ 立即上傳", primary: true, action: () => syncPushNow(false) });
    actions.push({ label: "⬇ 從雲端拉取", action: syncPullNow });
    actions.push({ label: "登出", action: syncSignOut });
  }
  actions.push({ label: "關閉", action: closeModal });
  showModal("雲端同步", body, actions);
}

// 啟動: 如果有有效快取 token 直接用；過期就停在「signed-out + 提示」狀態，
// 不主動跑 silent OAuth (GIS 即使 prompt:"none" 也會閃視窗)，等使用者按按鈕。
async function syncBootstrap() {
  if (!GOOGLE_CLIENT_ID) { _syncSetStatus("signed-out"); return; }
  if (localStorage.getItem(SYNC_FLAG_KEY) !== "1") { _syncSetStatus("signed-out"); return; }
  const cached = _loadCachedToken();
  if (cached) {
    Sync.accessToken = cached;
    _syncSetStatus("signed-in");
    syncReconcile(); // 不 await，讓畫面先回應
    return;
  }
  // 沒有有效快取 → 不彈視窗，標示「點同步重新連線」等使用者主動按
  _syncSetStatus("signed-out", "點同步重新連線");
}

function _trajLoadBg() {
  if (_traj.bgImg) return;
  _traj.bgImg = new Image();
  _traj.bgImg.onload = () => _trajRedraw();
  _traj.bgImg.src = _STADIUM_SRC;
}

const TRAJ_STORE_KEY = "beyx_traj_slots";
// slots: [{name, strokes}], currentIdx

function _trajGetSlots() {
  try { return JSON.parse(localStorage.getItem(TRAJ_STORE_KEY)) || []; } catch(e) { return []; }
}
function _trajSetSlots(slots) {
  try { localStorage.setItem(TRAJ_STORE_KEY, JSON.stringify(slots)); } catch(e) {}
}
function _trajSave() {
  // auto-save current strokes into active slot
  if (_traj.activeSlot == null) return;
  const slots = _trajGetSlots();
  if (slots[_traj.activeSlot]) {
    slots[_traj.activeSlot].strokes = _traj.strokes;
    _trajSetSlots(slots);
    _trajTriggerSync();
  }
}
function _trajTriggerSync() {
  // 更新 updatedAt 並觸發 sync push
  state.updatedAt = Date.now();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  if (typeof scheduleSyncPush === "function") scheduleSyncPush();
}
function _trajLoad() {
  // migrate old single-key format
  try {
    const old = localStorage.getItem("beyx_trajectory");
    if (old) {
      const strokes = JSON.parse(old);
      if (strokes.length) {
        const slots = _trajGetSlots();
        slots.push({ name: "未命名", strokes });
        _trajSetSlots(slots);
      }
      localStorage.removeItem("beyx_trajectory");
    }
  } catch(e) {}
}

function trajSaveNew() {
  if (!_traj.strokes.length) return;
  const name = prompt("軌跡名稱：", "軌跡 " + (_trajGetSlots().length + 1));
  if (!name) return;
  const slots = _trajGetSlots();
  slots.push({ name, strokes: JSON.parse(JSON.stringify(_traj.strokes)) });
  _trajSetSlots(slots);
  _traj.activeSlot = slots.length - 1;
  _trajRenderSlots();
  _trajTriggerSync();
}

function trajLoadSlot(idx) {
  const slots = _trajGetSlots();
  if (!slots[idx]) return;
  _traj.strokes = JSON.parse(JSON.stringify(slots[idx].strokes));
  _traj.activeSlot = idx;
  _trajRedraw();
  _trajRenderSlots();
}

function trajDeleteSlot(idx) {
  const slots = _trajGetSlots();
  if (!slots[idx]) return;
  if (!confirm("刪除「" + slots[idx].name + "」？")) return;
  slots.splice(idx, 1);
  _trajSetSlots(slots);
  if (_traj.activeSlot === idx) { _traj.activeSlot = null; _traj.strokes = []; _trajRedraw(); }
  else if (_traj.activeSlot > idx) _traj.activeSlot--;
  _trajRenderSlots();
  _trajTriggerSync();
}

function trajNewCanvas() {
  _traj.strokes = [];
  _traj.activeSlot = null;
  _trajRedraw();
  _trajRenderSlots();
}

function _trajRenderSlots() {
  const el = document.getElementById("traj-slots");
  if (!el) return;
  const slots = _trajGetSlots();
  if (!slots.length) { el.innerHTML = '<span style="color:var(--muted); font-size:12px;">尚無儲存的軌跡</span>'; return; }
  el.innerHTML = slots.map((s, i) =>
    `<span style="display:inline-flex; align-items:center; gap:4px; padding:8px 14px; border-radius:16px; font-size:14px; cursor:pointer; background:${i === _traj.activeSlot ? 'var(--accent)' : 'var(--panel2)'}; color:${i === _traj.activeSlot ? '#fff' : 'var(--text)'};" onclick="trajLoadSlot(${i})">${s.name}<span onclick="event.stopPropagation(); trajDeleteSlot(${i})" style="margin-left:6px; font-size:18px; line-height:1; opacity:0.6; cursor:pointer;">&times;</span></span>`
  ).join(" ");
}

function _trajDrawBg(ctx, w, h) {
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
  if (_traj.bgImg && _traj.bgImg.complete && _traj.bgImg.naturalWidth) {
    ctx.drawImage(_traj.bgImg, 0, 0, w, h);
  }
}

function _trajDrawStrokes(ctx, strokes) {
  for (const s of strokes) {
    if (s.pts.length < 2) continue;
    ctx.strokeStyle = s.color; ctx.lineWidth = s.width;
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(s.pts[0].x, s.pts[0].y);
    for (let i = 1; i < s.pts.length; i++) ctx.lineTo(s.pts[i].x, s.pts[i].y);
    ctx.stroke();
    const r = Math.max(s.width * 1.2, 6);
    const start = s.pts[0], end = s.pts[s.pts.length - 1];
    ctx.fillStyle = s.color;
    ctx.beginPath(); ctx.arc(start.x, start.y, r, 0, Math.PI * 2); ctx.fill();
    const last2 = s.pts.length >= 3 ? s.pts[s.pts.length - 3] : start;
    const angle = Math.atan2(end.y - last2.y, end.x - last2.x);
    const aLen = r * 3, aW = r * 2;
    ctx.beginPath();
    ctx.moveTo(end.x + Math.cos(angle) * aLen, end.y + Math.sin(angle) * aLen);
    ctx.lineTo(end.x + Math.cos(angle + Math.PI * 0.7) * aW, end.y + Math.sin(angle + Math.PI * 0.7) * aW);
    ctx.lineTo(end.x + Math.cos(angle - Math.PI * 0.7) * aW, end.y + Math.sin(angle - Math.PI * 0.7) * aW);
    ctx.closePath(); ctx.fill();
  }
}

function _trajRedraw() {
  _trajDrawBg(_traj.ctx, _traj.w, _traj.h);
  _trajDrawStrokes(_traj.ctx, _traj.strokes);
}

function _trajPos(e) {
  const rect = _traj.canvas.getBoundingClientRect();
  const sx = _traj.w / rect.width, sy = _traj.h / rect.height;
  const t = e.touches ? e.touches[0] : e;
  return { x: (t.clientX - rect.left) * sx, y: (t.clientY - rect.top) * sy };
}
function _trajStart(e) {
  e.preventDefault(); _traj.drawing = true;
  const color = document.getElementById("traj-color").value;
  const width = parseFloat(document.getElementById("traj-width").value);
  _traj.current = { color, width, pts: [_trajPos(e)] };
}
function _trajMove(e) {
  if (!_traj.drawing || !_traj.current) return;
  e.preventDefault();
  const pt = _trajPos(e); _traj.current.pts.push(pt);
  const pts = _traj.current.pts, { ctx } = _traj;
  if (pts.length >= 2) {
    ctx.strokeStyle = _traj.current.color; ctx.lineWidth = _traj.current.width;
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(pts[pts.length-2].x, pts[pts.length-2].y);
    ctx.lineTo(pt.x, pt.y); ctx.stroke();
  }
}
function _trajEnd() {
  if (!_traj.drawing) return;
  _traj.drawing = false;
  if (_traj.current && _traj.current.pts.length >= 2) _traj.strokes.push(_traj.current);
  _traj.current = null;
  _trajRedraw(); _trajSave();
}
function trajUndo() { _traj.strokes.pop(); _trajRedraw(); _trajSave(); }
function trajClear() { _traj.strokes = []; _trajRedraw(); _trajSave(); }

function trajExport() {
  if (!_traj.canvas) return;
  const { w, h, strokes } = _traj;
  const off = document.createElement("canvas");
  off.width = w; off.height = h;
  const c = off.getContext("2d");
  _trajDrawBg(c, w, h);
  _trajDrawStrokes(c, strokes);
  const fname = "beyblade-軌跡圖.png";
  off.toBlob(blob => {
    if (!blob) return;
    const file = new File([blob], fname, { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] }).catch(() => {});
    } else {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.download = fname; link.href = url; link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
  }, "image/png");
}

function openTrajectory() {
  _trajLoad(); _trajLoadBg();
  let overlay = document.getElementById("traj-overlay");
  if (overlay) { overlay.style.display = "flex"; _trajRedraw(); _trajRenderSlots(); return; }
  overlay = document.createElement("div");
  overlay.id = "traj-overlay";
  overlay.style.cssText = "position:fixed; inset:0; z-index:200; display:flex; flex-direction:column; background:#fff;";
  overlay.innerHTML = `
    <div style="display:flex; flex-direction:column; gap:6px; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--border);">
      <div style="display:flex; align-items:center; gap:8px;">
        <button onclick="closeTrajectory()" style="font-size:13px;">← 返回</button>
        <label style="font-size:13px; color:var(--muted);">顏色</label>
        <input type="color" id="traj-color" value="#1a3a8a" style="width:32px; height:28px; border:none; background:none; cursor:pointer;">
        <label style="font-size:13px; color:var(--muted);">粗細</label>
        <input type="range" id="traj-width" min="2" max="16" value="8" style="width:80px;">
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <button onclick="trajUndo()" style="font-size:13px;">↩ 復原</button>
        <button onclick="trajClear()" style="font-size:13px; color:#ff6b6b;">清空</button>
        <button onclick="trajSaveNew()" style="font-size:13px; background:#2ecc71; color:#fff; border-color:#2ecc71;">儲存</button>
        <button onclick="trajNewCanvas()" style="font-size:13px; background:var(--accent); color:#fff; border-color:var(--accent);">新畫布</button>
        <button onclick="trajExport()" style="font-size:13px;">匯出圖片</button>
      </div>
      <div id="traj-slots" style="display:flex; flex-wrap:wrap; gap:6px; min-height:20px;"></div>
    </div>
    <div id="traj-container" style="flex:1; min-height:0; display:flex; align-items:center; justify-content:center; background:#fff; touch-action:none; overflow:hidden;">
      <canvas id="traj-canvas"></canvas>
    </div>`;
  document.body.appendChild(overlay);

  const canvas = document.getElementById("traj-canvas");
  const container = document.getElementById("traj-container");
  const cw = container.clientWidth, ch = container.clientHeight;
  // Image aspect ratio: 1315:1196 ≈ 1.0994
  const imgRatio = 1315 / 1196;
  let dispW, dispH;
  if (cw / ch > imgRatio) { dispH = Math.min(ch, 800); dispW = Math.round(dispH * imgRatio); }
  else { dispW = Math.min(cw, 800); dispH = Math.round(dispW / imgRatio); }
  const dpr = window.devicePixelRatio || 1;
  const resW = Math.round(dispW * dpr), resH = Math.round(dispH * dpr);
  _traj.w = resW; _traj.h = resH; _traj.canvas = canvas; _traj.ctx = canvas.getContext("2d");
  canvas.width = resW; canvas.height = resH;
  canvas.style.width = dispW + "px"; canvas.style.height = dispH + "px";
  _trajRedraw();

  canvas.addEventListener("mousedown", _trajStart);
  canvas.addEventListener("mousemove", _trajMove);
  canvas.addEventListener("mouseup", _trajEnd);
  canvas.addEventListener("mouseleave", _trajEnd);
  canvas.addEventListener("touchstart", _trajStart, { passive: false });
  canvas.addEventListener("touchmove", _trajMove, { passive: false });
  canvas.addEventListener("touchend", _trajEnd);
  canvas.addEventListener("touchcancel", _trajEnd);
  _trajRenderSlots();
}

function closeTrajectory() {
  const el = document.getElementById("traj-overlay");
  if (el) el.style.display = "none";
}

// ============================================================
// 啟動
// ============================================================
// 套用主題
if (state.prefs.theme === "light") {
  document.documentElement.dataset.theme = "light";
  document.querySelector('meta[name="theme-color"]').content = "#ffffff";
}
updateThemeBtn();
applyProductsOnly();

render();
fetchNews().then(updateNewsDot);
syncBootstrap();

// 註冊 Service Worker (離線支援)
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
